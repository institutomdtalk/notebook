<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caderno do Aluno — MD Talk</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ROOT */
:root{
  --navy:#0B1D3A;--navy-deep:#050D1A;--navy-mid:#0F2645;--navy-light:#163158;
  --gold:#C4A45A;--gold-light:#D4BA7A;--gold-pale:#E8D9B0;
  --cream:rgba(255,255,255,.88);--muted:rgba(255,255,255,.42);
  --neon:#00E5FF;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Raleway',sans-serif;background:var(--navy-deep);color:var(--cream);overflow-x:hidden;}

/* HERO */
#hero{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;}
#hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.6s ease;}
#hero-bg.loaded{opacity:1;}
#hero-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(5,13,26,.80) 0%,rgba(5,13,26,.68) 40%,rgba(5,13,26,.88) 100%);}
#hero-dots{position:absolute;inset:0;background-image:radial-gradient(rgba(196,164,90,.07) 1px,transparent 1px);background-size:30px 30px;pointer-events:none;}
.geo{position:absolute;pointer-events:none;}
.geo-ring{width:340px;height:340px;border:1px solid rgba(196,164,90,.13);border-radius:50%;top:-80px;right:-90px;animation:geoFloat 11s ease-in-out infinite;}
.geo-ring-2{width:200px;height:200px;border:1px solid rgba(196,164,90,.09);border-radius:50%;bottom:100px;left:-50px;animation:geoFloat 14s ease-in-out infinite;animation-delay:-5s;}
.geo-diamond{width:56px;height:56px;border:1px solid rgba(196,164,90,.22);bottom:180px;right:140px;animation:geoFloatD 8s ease-in-out infinite;animation-delay:-3s;}
.geo-line{width:1px;height:110px;background:linear-gradient(to bottom,transparent,rgba(196,164,90,.28),transparent);top:32%;left:72px;animation:geoFloat 10s ease-in-out infinite;animation-delay:-7s;}
@keyframes geoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes geoFloatD{0%,100%{transform:rotate(45deg) translateY(0)}50%{transform:rotate(45deg) translateY(-12px)}}
#hero-content{position:relative;z-index:10;text-align:center;padding:2rem 1.5rem;max-width:720px;opacity:0;transform:translateY(28px);transition:opacity 1s ease .5s,transform 1s ease .5s;}
#hero-content.visible{opacity:1;transform:translateY(0);}
.overline{font-family:'Raleway',sans-serif;font-size:10px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin-bottom:.6rem;display:block;}
.hero-name{font-family:'Cormorant Garamond',serif;font-size:clamp(4.5rem,12vw,9rem);font-weight:400;line-height:.95;color:var(--cream);}
.hero-divider{width:40px;height:1px;background:rgba(196,164,90,.5);margin:1.4rem auto 1.2rem;}
.hero-info{font-family:'Raleway',sans-serif;font-size:.7rem;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:.9rem;}
.hero-info .sep{width:3px;height:3px;background:var(--gold);border-radius:50%;opacity:.6;}
#clock{font-family:'Cormorant Garamond',serif;font-size:clamp(1.1rem,3vw,1.6rem);font-weight:300;letter-spacing:.18em;color:var(--cream);opacity:.75;margin-bottom:1.4rem;}
.clima-label{font-family:'Raleway',sans-serif;font-size:.62rem;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);opacity:.7;display:flex;align-items:center;justify-content:center;gap:7px;}
.clima-dot{width:6px;height:6px;background:var(--gold);border-radius:50%;animation:pulse 2.2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
.scroll-indicator{position:absolute;bottom:2.2rem;left:50%;transform:translateX(-50%);z-index:10;display:flex;flex-direction:column;align-items:center;gap:7px;animation:sP 2.8s ease-in-out infinite;}
.scroll-indicator span{font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-family:'Raleway',sans-serif;}
.scroll-line{width:1px;height:38px;background:linear-gradient(to bottom,var(--gold),transparent);}
@keyframes sP{0%,100%{opacity:.28;transform:translateX(-50%) translateY(0)}50%{opacity:.65;transform:translateX(-50%) translateY(7px)}}
#loading-state{position:absolute;inset:0;background:var(--navy-deep);display:flex;align-items:center;justify-content:center;z-index:20;transition:opacity .9s ease;}
#loading-state.hidden{opacity:0;pointer-events:none;}
.loading-logo{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:300;letter-spacing:.35em;color:var(--gold);text-transform:uppercase;animation:fIO 1.9s ease-in-out infinite;}
@keyframes fIO{0%,100%{opacity:.15}50%{opacity:.75}}

/* BARRA DE TRADUÇÃO NO HERO */
#hero-translator {
  position: absolute;
  top: 2rem;
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  width: min(520px, 88vw);
  opacity: 0;
  animation: htAppear 1s ease 1.4s forwards;
}
@keyframes htAppear { to { opacity: 1; } }
#hero-translator.visible { opacity: 1; animation: none; }

.ht-wrap {
  display: flex;
  align-items: center;
  background: rgba(5,13,26,0.28);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 50px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  padding: 5px 5px 5px 18px;
  gap: 8px;
  transition: border-color .3s, background .3s;
}
.ht-wrap:focus-within {
  border-color: rgba(196,164,90,.4);
  background: rgba(5,13,26,0.42);
}

/* Botão de direção */
.ht-dir {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
  cursor: pointer;
  opacity: .65;
  transition: opacity .2s;
}
.ht-dir:hover { opacity: 1; }
.ht-dir-from, .ht-dir-to {
  font-family: 'Raleway', sans-serif;
  font-size: 8.5px;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--cream);
}
.ht-dir-arrow {
  color: rgba(255,255,255,.5);
  font-size: 11px;
  line-height: 1;
  transition: transform .3s ease;
}
.ht-dir.flipped .ht-dir-arrow { transform: rotate(180deg); }

/* Divisor */
.ht-sep {
  width: 1px;
  height: 14px;
  background: rgba(255,255,255,.12);
  flex-shrink: 0;
}

/* Campo de texto */
#ht-input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  font-family: 'Raleway', sans-serif;
  font-size: .76rem;
  font-weight: 300;
  color: var(--cream);
  letter-spacing: .04em;
  min-width: 0;
}
#ht-input::placeholder {
  color: rgba(255,255,255,.25);
  font-style: italic;
  font-size: .72rem;
}

/* Botão traduzir */
.ht-btn {
  flex-shrink: 0;
  position: relative;
  background: rgba(196,164,90,.15);
  border: 1px solid rgba(196,164,90,.3);
  border-radius: 40px;
  padding: .45rem 1.2rem;
  font-family: 'Raleway', sans-serif;
  font-size: .6rem;
  font-weight: 600;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--gold-pale);
  cursor: pointer;
  transition: background .2s, border-color .2s;
  white-space: nowrap;
}
.ht-btn:hover { background: rgba(196,164,90,.28); border-color: rgba(196,164,90,.55); }
.ht-btn:disabled { opacity: .4; cursor: wait; }

/* Ponto orbital */
.ht-btn-ring {
  position: absolute;
  inset: -5px;
  border-radius: 40px;
  pointer-events: none;
  animation: htOrbit 2.4s linear infinite;
}
.ht-btn-ring::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 0;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--gold);
  transform: translateY(-50%);
  box-shadow: 0 0 6px 2px rgba(196,164,90,.5);
}
@keyframes htOrbit {
  0%   { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
.ht-btn.loading .ht-btn-ring { animation-duration: .8s; }
.ht-btn-txt { line-height: 1; }

/* Resultado */
#ht-result {
  margin-top: 8px;
  padding: .85rem 1.2rem;
  background: rgba(5,13,26,.6);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 14px;
  backdrop-filter: blur(14px);
  display: none;
  animation: htFadeIn .3s ease;
}
@keyframes htFadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
#ht-result.visible { display: block; }

.ht-result-main {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.4rem;
  font-weight: 300;
  color: var(--cream);
  margin-bottom: .5rem;
  line-height: 1.2;
}
.ht-result-alts {
  font-family: 'Raleway', sans-serif;
  font-size: .66rem;
  color: rgba(255,255,255,.45);
  letter-spacing: .05em;
}
.ht-result-alts span {
  color: var(--gold-pale);
  opacity: .7;
}
.ht-loading {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: .2rem 0;
}
.ht-spinner {
  width: 14px; height: 14px;
  border: 1.5px solid rgba(196,164,90,.2);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: htSpin .7s linear infinite;
}
@keyframes htSpin { to { transform: rotate(360deg); } }
.ht-loading span {
  font-family: 'Raleway', sans-serif;
  font-size: .63rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
}
/* Fechar resultado */
.ht-close {
  float: right;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: rgba(255,255,255,.08);
  border: none; color: var(--muted);
  cursor: pointer; font-size: 10px;
  display: flex; align-items: center; justify-content: center;
  margin-left: 8px; transition: background .2s;
}
.ht-close:hover { background: rgba(255,255,255,.18); }

/* MUSIC PLAYER */
#music-player {
  position: absolute;
  top: 2rem;
  right: 2rem;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 8px;
  opacity: 0;
  animation: htAppear 1s ease 1.8s forwards;
}

#music-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(5,13,26,.3);
  border: 1px solid rgba(255,255,255,.15);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background .2s, border-color .2s;
  color: rgba(255,255,255,.6);
}
#music-btn:hover {
  background: rgba(5,13,26,.5);
  border-color: rgba(196,164,90,.4);
  color: var(--gold-pale);
}
#music-btn.playing { border-color: rgba(196,164,90,.35); color: var(--gold-pale); }

/* Barras de equalizer animadas */
.eq-bars {
  display: flex;
  align-items: flex-end;
  gap: 2px;
  height: 12px;
}
.eq-bar {
  width: 3px;
  border-radius: 2px;
  background: var(--gold);
  opacity: 0;
  transition: opacity .3s;
}
#music-btn.playing .eq-bar { opacity: 1; }
.eq-bar:nth-child(1) { animation: eqAnim 1.1s ease-in-out infinite; }
.eq-bar:nth-child(2) { animation: eqAnim  .8s ease-in-out infinite .15s; }
.eq-bar:nth-child(3) { animation: eqAnim  .9s ease-in-out infinite .05s; }
.eq-bar:nth-child(4) { animation: eqAnim 1.2s ease-in-out infinite .25s; }
@keyframes eqAnim {
  0%,100% { height: 3px; }
  50%      { height: 12px; }
}

#music-label {
  font-family: 'Raleway', sans-serif;
  font-size: .58rem;
  font-weight: 500;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: rgba(255,255,255,.35);
  transition: color .3s;
  white-space: nowrap;
}
#music-player.playing #music-label { color: rgba(196,164,90,.6); }

/* YouTube iframe escondido */
#yt-frame { display: none; }

/* ABAS ESTILO CHROME */
#chrome-tabbar {
  background: #E8E4DF;
  display: flex;
  align-items: flex-end;
  padding: 10px 12px 0;
  gap: 2px;
  min-height: 44px;
  overflow-x: auto;
  scrollbar-width: none;
  position: relative;
  z-index: 90;
}
#chrome-tabbar::-webkit-scrollbar { display: none; }

/* Cada aba */
.ctab {
  position: relative;
  display: flex;
  align-items: center;
  gap: 7px;
  height: 34px;
  min-width: 150px;
  max-width: 230px;
  padding: 0 10px 0 12px;
  border-radius: 8px 8px 0 0;
  background: #D0CBC4;
  cursor: pointer;
  flex-shrink: 0;
  transition: background .15s, box-shadow .15s;
  z-index: 1;
}
.ctab:hover {
  background: #DEDAD4;
  box-shadow: 0 -2px 8px rgba(0,0,0,.1);
}
.ctab.active {
  background: #F5F2EE;
  z-index: 3;
  box-shadow:
    -3px -3px 8px rgba(0,0,0,.12),
    3px -3px 8px rgba(0,0,0,.08);
}

/* Curvas nas laterais da aba ativa */
.ctab::before,
.ctab::after {
  content: '';
  position: absolute;
  bottom: 0;
  width: 16px;
  height: 16px;
  pointer-events: none;
  z-index: 4;
}
.ctab::before {
  left: -15px;
  background: radial-gradient(circle at 100% 0%, transparent 69%, #F5F2EE 70%);
  opacity: 0;
}
.ctab::after {
  right: -15px;
  background: radial-gradient(circle at 0% 0%, transparent 69%, #F5F2EE 70%);
  opacity: 0;
}
.ctab.active::before,
.ctab.active::after { opacity: 1; }

/* Favicon */
.ctab-fav {
  width: 16px; height: 16px;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  color: rgba(0,0,0,.35);
}
.ctab.active .ctab-fav          { color: #888; }
#ctab-planner.active .ctab-fav  { color: #7c6ea0; }
#ctab-flash.active   .ctab-fav  { color: #2196F3; }
#ctab-dash.active    .ctab-fav  { color: var(--gold); }

/* Título */
.ctab-title {
  font-family: -apple-system, 'Segoe UI', sans-serif;
  font-size: .76rem;
  font-weight: 400;
  color: rgba(0,0,0,.5);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  min-width: 0;
  line-height: 1;
}
.ctab.active .ctab-title { color: #1a1a1a; font-weight: 500; }

/* Botão fechar */
.ctab-x {
  width: 16px; height: 16px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  color: transparent;
  font-size: 10px;
  transition: background .15s, color .15s;
  line-height: 1;
}
.ctab:hover .ctab-x { color: rgba(0,0,0,.4); }
.ctab:hover .ctab-x:hover { background: rgba(0,0,0,.1); color: rgba(0,0,0,.7); }
.ctab.active:hover .ctab-x { color: rgba(0,0,0,.45); }
.ctab.active:hover .ctab-x:hover { background: rgba(0,0,0,.1); color: rgba(0,0,0,.8); }

/* Linha que funde a aba ativa com o painel */
#chrome-tabbar::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 1px;
  background: #F5F2EE;
  z-index: 2;
  pointer-events: none;
}

/* Painel */
#tab-panels { background: #F5F2EE; }
.tab-panel  { display: none; }
.tab-panel.active { display: block; }

/* DASHBOARD */
.dash-header {
  margin-bottom: 2rem;
}
.dash-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.8rem; font-weight: 300; color: #1a1a2e;
  margin-bottom: .2rem;
}
.dash-title em { font-style: italic; color: var(--gold); }
.dash-sub {
  font-family: 'Raleway', sans-serif;
  font-size: .68rem; color: #aaa; letter-spacing: .08em;
}

/* Cards de métricas */
.dash-metrics {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 1rem;
  margin-bottom: 2rem;
}
.dash-metric {
  background: #fff;
  border: 1.5px solid #ece8e2;
  border-radius: 14px;
  padding: 1.2rem 1.3rem;
  transition: transform .18s, box-shadow .18s;
}
.dash-metric:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.07); }
.dm-icon {
  width: 36px; height: 36px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: .8rem;
  color: #fff;
}
.dm-num {
  font-family: 'Cormorant Garamond', serif;
  font-size: 2rem; font-weight: 300;
  color: #1a1a2e; line-height: 1;
  margin-bottom: .2rem;
}
.dm-label {
  font-family: 'Raleway', sans-serif;
  font-size: .62rem; font-weight: 600;
  letter-spacing: .12em; text-transform: uppercase;
  color: #bbb;
}
.dm-delta {
  font-family: 'Raleway', sans-serif;
  font-size: .6rem; color: #4caf50;
  margin-top: .3rem;
}

/* Layout radar + histórico */
.dash-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.2rem;
  margin-bottom: 1.2rem;
}
@media(max-width:700px){ .dash-grid { grid-template-columns: 1fr; } }

.dash-card {
  background: #fff;
  border: 1.5px solid #ece8e2;
  border-radius: 16px;
  padding: 1.4rem 1.5rem;
}
.dash-card-title {
  font-family: 'Raleway', sans-serif;
  font-size: 8px; font-weight: 700;
  letter-spacing: .26em; text-transform: uppercase;
  color: #aaa; margin-bottom: 1.2rem;
}

/* Radar chart canvas */
#radar-canvas { display: block; margin: 0 auto; }

/* Histórico semanal — barras */
.hist-bars {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  height: 100px;
  padding-top: .5rem;
}
.hist-bar-wrap {
  display: flex; flex-direction: column;
  align-items: center; gap: 5px; flex: 1;
}
.hist-bar {
  width: 100%;
  border-radius: 4px 4px 0 0;
  background: linear-gradient(to top, var(--gold), var(--gold-light));
  transition: height .6s ease;
  min-height: 3px;
}
.hist-bar-lbl {
  font-family: 'Raleway', sans-serif;
  font-size: .55rem; color: #ccc;
  letter-spacing: .08em; text-transform: uppercase;
}

/* Atividades recentes */
.dash-activities {
  display: flex; flex-direction: column; gap: .6rem;
}
.da-item {
  display: flex; align-items: center; gap: 10px;
  padding: .6rem .8rem;
  background: #fafafa;
  border-radius: 10px;
  border: 1px solid #f0ece6;
}
.da-dot {
  width: 8px; height: 8px; border-radius: 50%;
  flex-shrink: 0;
}
.da-text {
  font-family: 'Raleway', sans-serif;
  font-size: .7rem; color: #555; flex: 1;
}
.da-time {
  font-family: 'Raleway', sans-serif;
  font-size: .6rem; color: #ccc;
}

/* Streak */
.dash-streak {
  display: flex; align-items: center; gap: 6px;
  margin-top: .3rem;
}
.streak-flame {
  color: #ff7043;
}
.streak-num {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.1rem; font-weight: 300; color: #1a1a2e;
}
.streak-lbl {
  font-family: 'Raleway', sans-serif;
  font-size: .6rem; color: #aaa;
  letter-spacing: .08em; text-transform: uppercase;
}

/* CADERNO NAV */
#caderno-nav{position:sticky;top:0;z-index:100;background:rgba(245,242,238,.96);backdrop-filter:blur(12px);border-bottom:1.5px solid #e8e4df;padding:0 2rem;}
.nav-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:1rem;height:60px;}
.nav-brand{font-family:'Cormorant Garamond',serif;font-size:1.1rem;color:#1a1a2e;white-space:nowrap;margin-right:.5rem;}
.nav-brand em{font-style:italic;color:var(--gold);}
.nav-tabs{display:flex;align-items:center;flex:1;overflow-x:auto;scrollbar-width:none;}
.nav-tabs::-webkit-scrollbar{display:none;}
.ntab{font-family:'Raleway',sans-serif;font-size:.67rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#aaa;background:transparent;border:none;border-bottom:2px solid transparent;padding:0 1rem;height:60px;cursor:pointer;transition:color .2s,border-color .2s;white-space:nowrap;flex-shrink:0;}
.ntab:hover{color:#555;}
.ntab.active{color:#1a1a2e;border-bottom-color:var(--gold);}
.ntab-nova{color:var(--gold)!important;border:1.5px dashed rgba(196,164,90,.35)!important;border-radius:20px!important;height:auto!important;padding:.25rem .8rem!important;margin-left:.5rem;font-size:.6rem!important;}

.c-trad::before{content:'';width:10px;height:1px;background:var(--gold);opacity:.5;flex-shrink:0;}
.c-ex{font-family:'Raleway',sans-serif;font-size:.67rem;color:#999;font-style:italic;line-height:1.6;border-top:1px solid #f0ece6;padding-top:.5rem;margin-top:.25rem;}

/* MODAL */
.modal-bd{position:fixed;inset:0;background:rgba(26,26,46,.5);backdrop-filter:blur(8px);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;}

.modal-top{background:#1a1a2e;padding:1.4rem 1.8rem;display:flex;align-items:center;justify-content:space-between;}

.fg{margin-bottom:1rem;}
.flbl{display:block;font-family:'Raleway',sans-serif;font-size:8px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:#aaa;margin-bottom:.4rem;}

.fsel{appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23C4A45A' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center;padding-right:2rem;cursor:pointer;}

.frow{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;}

.btn-save{width:100%;background:#1a1a2e;border:none;border-radius:10px;padding:.8rem;font-family:'Raleway',sans-serif;font-size:.63rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#fff;cursor:pointer;margin-top:.4rem;}

/* TOUR */

.t-btns{display:flex;justify-content:center;gap:.8rem;align-items:center;}

/* PLANNER */
.pl-header{display:flex;align-items:center;gap:1rem;margin-bottom:1.8rem;flex-wrap:wrap;}
.pl-week{font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-weight:300;color:#1a1a2e;flex:1;}
.pl-nav{display:flex;gap:4px;}
.pl-nav-btn{width:30px;height:30px;border-radius:8px;border:1.5px solid #e8e4e0;background:#fff;color:#555;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.pl-nav-btn:hover{border-color:var(--gold);color:var(--gold);}
.pl-sug{display:flex;align-items:center;gap:6px;background:#1a1a2e;color:#fff;border:none;border-radius:20px;padding:.45rem 1rem;font-family:'Raleway',sans-serif;font-size:.6rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;}
.pl-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:.6rem;margin-bottom:1.8rem;}
.pl-day{background:#fff;border:1.5px solid #ece8e2;border-radius:12px;padding:.75rem .6rem;min-height:150px;position:relative;transition:border-color .2s;}
.pl-day.today{border-color:var(--gold);box-shadow:0 4px 16px rgba(196,164,90,.15);}
.pl-dlbl{font-family:'Raleway',sans-serif;font-size:7px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#ccc;margin-bottom:.2rem;}
.pl-dnum{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:300;color:#1a1a2e;margin-bottom:.6rem;}
.pl-day.today .pl-dnum{color:var(--gold);}
.pl-acts{display:flex;flex-wrap:wrap;gap:4px;}
.a-ico{position:relative;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s,box-shadow .15s;background:#F8F6F3;border:1.5px solid #e0dbd4;}
.a-ico:hover{transform:scale(1.08);box-shadow:0 3px 10px rgba(0,0,0,.1);}
.a-ico.done{opacity:.35;filter:grayscale(.3);}
.a-ico.done::after{content:'v';position:absolute;top:-4px;right:-4px;width:14px;height:14px;background:#4caf50;border-radius:50%;font-size:8px;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Raleway',sans-serif;font-weight:700;}
.a-ico .tip{display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;font-family:'Raleway',sans-serif;font-size:.58rem;white-space:nowrap;padding:4px 10px;border-radius:6px;z-index:50;pointer-events:none;}
.a-ico:hover .tip{display:block;}
.a-add{width:28px;height:28px;border-radius:8px;border:1.5px dashed #d0cbc4;background:transparent;color:#ccc;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.a-add:hover{border-color:var(--gold);color:var(--gold);}
.a-picker{display:none;position:absolute;top:0;left:calc(100% + 8px);background:#fff;border:1.5px solid #ece8e2;border-radius:12px;padding:.8rem;box-shadow:0 8px 32px rgba(0,0,0,.14);z-index:100;width:200px;}
.a-picker.open{display:block;}
.p-ttl{font-family:'Raleway',sans-serif;font-size:7.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#aaa;margin-bottom:.6rem;}
.p-items{display:flex;flex-wrap:wrap;gap:6px;}
.p-item{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#F8F6F3;border:1.5px solid #e0dbd4;transition:all .15s;position:relative;}
.p-item:hover{border-color:var(--gold);transform:scale(1.08);}
.p-item .tip{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;font-family:'Raleway',sans-serif;font-size:.58rem;white-space:nowrap;padding:3px 8px;border-radius:5px;z-index:200;pointer-events:none;}
.p-item:hover .tip{display:block;}
.pl-legend{background:#fff;border:1.5px solid #ece8e2;border-radius:12px;padding:1.1rem 1.2rem;}
.leg-ttl{font-family:'Raleway',sans-serif;font-size:8px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:#bbb;margin-bottom:.8rem;}
.leg-items{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;}
.leg-item{display:flex;align-items:center;gap:8px;}
.leg-ico{width:36px;height:36px;border-radius:10px;background:#F8F6F3;border:1.5px solid #e0dbd4;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.leg-txt{font-family:'Raleway',sans-serif;font-size:.65rem;color:#555;line-height:1.3;min-width:0;}

/* FLASHCARDS */
.fc-cfg{display:flex;align-items:center;gap:1rem;margin-bottom:1.8rem;flex-wrap:wrap;}
.fc-lbl{font-family:'Raleway',sans-serif;font-size:8px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:#999;white-space:nowrap;}
.fc-secs{display:flex;gap:.4rem;flex-wrap:wrap;}
.fc-sb{font-family:'Raleway',sans-serif;font-size:.6rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;border:1.5px solid #d4cfc9;background:#fff;border-radius:20px;padding:.3rem .8rem;cursor:pointer;color:#999;transition:all .15s;}

.fc-modes{display:flex;gap:.4rem;margin-left:auto;}

.fc-ex{font-family:'Raleway',sans-serif;font-size:.65rem;color:rgba(255,255,255,.4);font-style:italic;line-height:1.6;margin-top:.7rem;border-top:1px solid rgba(255,255,255,.1);padding-top:.7rem;}
.fc-hint{font-family:'Raleway',sans-serif;font-size:.6rem;color:#ccc;margin-top:.5rem;display:flex;align-items:center;gap:4px;}
.fc-ctrls{display:flex;align-items:center;gap:1rem;}
.fc-ctrl{width:42px;height:42px;border-radius:50%;border:1.5px solid #d4cfc9;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;}
.fc-ctrl.knew{border-color:#a5d6a7;color:#388e3c;background:#f1f8f1;}

.fc-shuf{font-family:'Raleway',sans-serif;font-size:.6rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;border:1.5px solid #d4cfc9;background:transparent;border-radius:20px;padding:.4rem .9rem;cursor:pointer;color:#999;transition:all .2s;display:flex;align-items:center;gap:4px;}

async function getWeather(city){

  const{lat,lon}=JSON.parse(txt.replace(/```json|```/g,"").trim());
  const w=await fetch("https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lon+"&current_weather=true");

async function htTranslate() {
  const txt = document.getElementById('ht-input').value.trim();
  if (!txt) { document.getElementById('ht-input').focus(); return; }
  const btn = document.getElementById('ht-btn');
  const res = document.getElementById('ht-result');

  btn.disabled = true;
  btn.classList.add('loading');
  res.classList.add('visible');

  const sl = htDir === 'PT_EN' ? 'pt' : 'en';
  const tl = htDir === 'PT_EN' ? 'en' : 'pt';
  try {
    const r = await fetch(
      'https://translate.googleapis.com/translate_a/single?client=gtx&sl='+sl+'&tl='+tl+'&dt=t&dt=bd&q='+encodeURIComponent(txt)
    );
    const d = await r.json();
    const main = d[0].filter(s=>s&&s[0]).map(s=>s[0]).join('');
    let alts = '';
    if (d[1] && d[1].length) {
      const sv = [];
      d[1].forEach(g => { if(g[2]) g[2].forEach(i => { if(i[0]) sv.push(i[0]); }); });
      if (sv.length) alts = '<div class="ht-result-alts">Também: <span>'+sv.slice(0,5).join('</span> · <span>')+'</span></div>';
    }
    out.innerHTML = '<div class="ht-result-main">'+main+'</div>'+alts;
  } catch(e) {
    out.innerHTML = '<div class="ht-result-alts" style="color:rgba(255,255,255,.35)">Erro. Tente novamente.</div>';
  }
  btn.disabled = false;
  btn.classList.remove('loading');
}
function htClose() {
  document.getElementById('ht-result').classList.remove('visible');

  const recentHtml = recent.map(e => `

      <span class="da-time">${e.data ? e.data.split('-').reverse().join('/') : ''}</span>

  body.innerHTML = `

      <div class="dash-metric">
        <div class="dm-icon" style="background:#C4A45A">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        </div>
        <div class="dm-num">${totalTermos}</div>
        <div class="dm-label">Entradas</div>
        <div class="dm-delta">↑ Total no caderno</div>
      </div>
      <div class="dash-metric">
        <div class="dm-icon" style="background:#00BCD4">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 8l6 6"/><path d="M4 14l6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="M22 22l-5-10-5 10"/><path d="M14 18h6"/></svg>
        </div>
        <div class="dm-num">${comTraducao}</div>
        <div class="dm-label">Com tradução</div>
        <div class="dm-delta">${totalTermos > 0 ? Math.round(comTraducao/totalTermos*100) : 0}% do total</div>
      </div>
      <div class="dash-metric">
        <div class="dm-icon" style="background:#7c6ea0">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </div>
        <div class="dm-num">${plannerDone}</div>
        <div class="dm-label">Planner</div>
        <div class="dm-delta">Atividades cumpridas</div>
      </div>
      <div class="dash-metric">
        <div class="dm-icon" style="background:#4CAF50">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>

    <div class="dash-grid">

    <div class="dash-card">

      <div class="dash-activities">${recentHtml || '<p style="font-family:Raleway,sans-serif;font-size:.72rem;color:#aaa;">Nenhuma entrada ainda.</p>'}</div>

  // Desenhar radar

function drawRadar(data) {
  const canvas = document.getElementById('radar-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2;
  const R  = Math.min(W, H) * 0.38;
  const n  = data.length;
  ctx.clearRect(0, 0, W, H);

  const angle = i => (Math.PI * 2 * i / n) - Math.PI/2;
  const pt    = (i, r) => ({
    x: cx + r * Math.cos(angle(i)),
    y: cy + r * Math.sin(angle(i)),
  });

  // Grades concêntricas
  [0.25, 0.5, 0.75, 1].forEach(pct => {
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const p = pt(i, R * pct);
      i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
    }
    ctx.closePath();
    ctx.strokeStyle = 'rgba(0,0,0,.07)';
    ctx.lineWidth = 1;
    ctx.stroke();
  });

  // Eixos
  for (let i = 0; i < n; i++) {
    const p = pt(i, R);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(p.x, p.y);
    ctx.strokeStyle = 'rgba(0,0,0,.1)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Área de dados
  ctx.beginPath();
  data.forEach((d, i) => {
    const p = pt(i, R * (d.val / 100));
    i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
  });
  ctx.closePath();
  ctx.fillStyle = 'rgba(196,164,90,.18)';
  ctx.fill();
  ctx.strokeStyle = '#C4A45A';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Pontos
  data.forEach((d, i) => {
    const p = pt(i, R * (d.val / 100));
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#C4A45A';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  });

  // Labels
  ctx.font = '500 10px Raleway, sans-serif';
  ctx.fillStyle = '#888';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  data.forEach((d, i) => {
    const p = pt(i, R * 1.22);
    ctx.fillText(d.label, p.x, p.y);
  });
}

const SK=[

  {id:'video-leg',e:'video-leg',l:'Video com legenda EN',d:'Assista com legenda em ingles'},
  {id:'cantar',e:'cantar',l:'Cantar em ingles',d:'Escolha uma musica e cante em ingles'},
  {id:'transcrever',e:'transcrever',l:'Transcrever musica',d:'Escreva a letra de uma musica ao ouvi-la'},
  {id:'infograficos',e:'infograficos',l:'3 Infograficos',d:'Leia e compreenda 3 infograficos em ingles'},
  {id:'leitura',e:'leitura',l:'Leitura de texto',d:'Leia um artigo ou capitulo'},
  {id:'noticia',e:'noticia',l:'Noticia online',d:'Leia uma noticia em ingles na internet'},
];
const SG=['video-sem','leitura','video-leg','noticia','infograficos','cantar','transcrever'];
const DN=['Dom','Seg','Ter','Qua','Qui','Sex','Sab'];
let pOff=0,pData={},pPicker=null;
function pDates(off){const t=new Date(),dow=t.getDay(),mon=new Date(t);mon.setDate(t.getDate()-dow+(dow===0?-6:1)+off*7);return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d;});}
function dKey(d){return d.toISOString().split('T')[0];}
function plannerWeek(dir){pOff+=dir;renderPlanner();}
function plannerSuggest(){pDates(pOff).forEach((d,i)=>{const k=dKey(d);if(!pData[k]||!pData[k].length)pData[k]=[SG[i]];});renderPlanner();}
function toggleDone(key,sid){const dk=key+'__done',done=pData[dk]||[];const i=done.indexOf(sid);if(i===-1)done.push(sid);else done.splice(i,1);pData[dk]=done;renderPlanner();}
function remAct(key,sid){if(pData[key])pData[key]=pData[key].filter(s=>s!==sid);renderPlanner();}
function addAct(key,sid){if(!pData[key])pData[key]=[];if(!pData[key].includes(sid))pData[key].push(sid);pPicker=null;renderPlanner();}
function togPicker(key){pPicker=pPicker===key?null:key;renderPlanner();}
function renderPlanner(){
  const body=document.getElementById('planner-body');if(!body)return;
  const dates=pDates(pOff),today=dKey(new Date());
  const fmt=d=>d.getDate()+'/'+(d.getMonth()+1);
  body.innerHTML='<div class="pl-header"><div class="pl-week">Semana de '+fmt(dates[0])+' a '+fmt(dates[6])+(pOff===0?' <small style="font-size:.7rem;color:#aaa">esta semana</small>':'')+'</div><div class="pl-nav"><button class="pl-nav-btn" onclick="plannerWeek(-1)">&#8249;</button><button class="pl-nav-btn" onclick="plannerWeek(1)">&#8250;</button></div><button class="pl-sug" onclick="plannerSuggest()">Sugerir semana</button></div><div class="pl-grid">'+
  dates.map(d=>{const key=dKey(d),isT=key===today,sks=pData[key]||[],done=pData[key+'__done']||[],pOpen=pPicker===key;return'<div class="pl-day '+(isT?'today':'')+'"><div class="pl-dlbl">'+DN[d.getDay()]+'</div><div class="pl-dnum">'+d.getDate()+'</div><div class="pl-acts">'+sks.map(sid=>{const sk=SK.find(s=>s.id===sid);if(!sk)return'';const isDone=done.includes(sid);return'<div class="a-ico '+(isDone?'done':'')+'" onclick="toggleDone(\''+key+'\',\''+sid+'\')" oncontextmenu="event.preventDefault();remAct(\''+key+'\',\''+sid+'\')">'+skSvg(sk.id,18,'#666')+'<span class="tip">'+sk.l+(isDone?' v':'')+'</span></div>';}).join('')+'<div style="position:relative"><button class="a-add" onclick="togPicker(\''+key+'\')">+</button><div class="a-picker '+(pOpen?'open':'')+'"><div class="p-ttl">Adicionar</div><div class="p-items">'+SK.map(sk=>'<div class="p-item" onclick="addAct(\''+key+'\',\''+sk.id+'\')">'+skSvg(sk.id,20,'#555')+'<span class="tip">'+sk.l+'</span></div>').join('')+'</div></div></div></div></div>';}).join('')+
  '</div><div class="pl-legend"><div class="leg-ttl">Habilidades</div><div class="leg-items">'+SK.map(sk=>'<div class="leg-item"><div class="leg-ico">'+skSvg(sk.id,20,'#777')+'</div><div class="leg-txt"><strong>'+sk.l+'</strong><br><span style="color:#aaa;font-size:.6rem">'+sk.d+'</span></div></div>').join('')+'</div></div>';
}

// FLASHCARDS
let fSecs=['vocabulario','frases','termos','anotacoes'],fMode='termo',fDeck=[],fIdx=0,fKnew=0,fSkip=0,fFlip=false;
function buildDeck(){const pool=entradas.filter(e=>fSecs.includes(e.secao)&&e.traducao&&e.traducao.trim());fDeck=[...pool].sort(()=>Math.random()-.5);fIdx=0;fKnew=0;fSkip=0;fFlip=false;}
function renderFlash(){
  const body=document.getElementById('flash-body');if(!body)return;
  const avail=[...new Set(entradas.filter(e=>e.traducao&&e.traducao.trim()).map(e=>e.secao))];
  const sL={vocabulario:'Vocabulario',frases:'Frases',termos:'Termos',anotacoes:'Anotacoes'};
  const sBtns=avail.map(s=>'<button class="fc-sb '+(fSecs.includes(s)?'on':'')+'" onclick="fTogSec(\''+s+'\')">'+(sL[s]||s)+'</button>').join('');
  const mBtns=[{id:'termo',l:'Termo > PT'},{id:'traducao',l:'PT > Termo'},{id:'aleatorio',l:'Aleatorio'}].map(m=>'<button class="fc-mb '+(fMode===m.id?'on':'')+'" onclick="fSetMode(\''+m.id+'\')">'+m.l+'</button>').join('');
  if(avail.length===0){body.innerHTML='<div class="fc-cfg"><span class="fc-lbl">Secoes</span><div class="fc-secs">'+sBtns+'</div><div class="fc-modes">'+mBtns+'</div></div><div class="fc-empty"><p>Nenhuma entrada com traducao.<br>Adicione termos com traducao no caderno.</p></div>';return;}
  if(fDeck.length===0)buildDeck();
  let arena;
  if(fIdx>=fDeck.length){const tot=fDeck.length,pct=tot>0?Math.round(fKnew/tot*100):0;arena='<div class="fc-done"><div class="fc-done-i">'+(pct>=70?'🎉':'💪')+'</div><div class="fc-done-t">'+(pct>=70?'Muito bem!':'Continue praticando!')+'</div><div class="fc-done-s">Voce acertou <strong>'+fKnew+'</strong> de <strong>'+tot+'</strong> cards ('+pct+'%).</div><button class="fc-restart" onclick="fRestart()">Repetir</button></div>';}
  else{const entry=fDeck[fIdx];const mode=fMode==='aleatorio'?(entry._m||(entry._m=Math.random()>.5?'termo':'traducao')):fMode;const front=mode==='termo'?entry.termo:entry.traducao,back=mode==='termo'?entry.traducao:entry.termo;const fL=mode==='termo'?'Termo':'Traducao',bL=mode==='termo'?'Traducao':'Termo';const pct=fDeck.length>0?(fIdx/fDeck.length*100):0;arena='<div class="fc-arena"><div class="fc-prog"><div class="fc-pb"><div class="fc-pf" style="width:'+pct+'%"></div></div><span class="fc-pl">'+(fIdx+1)+' / '+fDeck.length+'</span></div><div class="fc-wrap '+(fFlip?'flipped':'')+'" id="fc-card" onclick="doFlip()"><div class="fc-inner"><div class="fc-face front"><div class="fc-flbl">'+fL+'</div><div class="fc-term">'+front+'</div><div class="fc-hint">Clique para revelar</div></div><div class="fc-face back"><div class="fc-flbl">'+bL+'</div><div class="fc-term">'+back+'</div>'+(entry.exemplo?'<div class="fc-ex">'+entry.exemplo+'</div>':'')+'</div></div></div><div class="fc-ctrls"><button class="fc-ctrl skip" onclick="fNext(false)" title="Revisar depois"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/></svg></button><button class="fc-shuf" onclick="fShuf()">Embaralhar</button><button class="fc-ctrl knew" onclick="fNext(true)" title="Sabia!"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg></button></div><div class="fc-score"><div class="fc-si"><div class="fc-sn g">'+fKnew+'</div><div class="fc-sl">Sabia</div></div><div class="fc-si"><div class="fc-sn o">'+fSkip+'</div><div class="fc-sl">Revisar</div></div></div></div>';}
  body.innerHTML='<div class="fc-cfg"><span class="fc-lbl">Secoes</span><div class="fc-secs">'+sBtns+'</div><div class="fc-modes">'+mBtns+'</div></div>'+arena;
}
function fTogSec(s){const i=fSecs.indexOf(s);if(i===-1)fSecs.push(s);else if(fSecs.length>1)fSecs.splice(i,1);buildDeck();renderFlash();}
function fSetMode(m){fMode=m;fDeck.forEach(e=>delete e._m);renderFlash();}
function doFlip(){fFlip=!fFlip;const c=document.getElementById('fc-card');if(c)c.classList.toggle('flipped');}
function fNext(k){if(k)fKnew++;else fSkip++;fFlip=false;fIdx++;renderFlash();}
function fShuf(){fDeck.sort(()=>Math.random()-.5);fIdx=0;fKnew=0;fSkip=0;fFlip=false;renderFlash();}
function fRestart(){buildDeck();renderFlash();}

];
