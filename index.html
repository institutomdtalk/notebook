<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caderno do Aluno — MD Talk</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ROOT */
:root{
  --navy:#0B1D3A;--navy-deep:#050D1A;--navy-mid:#0F2645;--navy-light:#163158;
  --gold:#C4A45A;--gold-light:#D4BA7A;--gold-pale:#E8D9B0;
  --cream:rgba(255,255,255,.88);--muted:rgba(255,255,255,.42);
  --neon:#00E5FF;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Raleway',sans-serif;background:var(--navy-deep);color:var(--cream);overflow-x:hidden;}

/* HERO */
#hero{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;}
#hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.6s ease;}
#hero-bg.loaded{opacity:1;}
#hero-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(5,13,26,.80) 0%,rgba(5,13,26,.68) 40%,rgba(5,13,26,.88) 100%);}
#hero-dots{position:absolute;inset:0;background-image:radial-gradient(rgba(196,164,90,.07) 1px,transparent 1px);background-size:30px 30px;pointer-events:none;}
.geo{position:absolute;pointer-events:none;}
.geo-ring{width:340px;height:340px;border:1px solid rgba(196,164,90,.13);border-radius:50%;top:-80px;right:-90px;animation:geoFloat 11s ease-in-out infinite;}
.geo-ring-2{width:200px;height:200px;border:1px solid rgba(196,164,90,.09);border-radius:50%;bottom:100px;left:-50px;animation:geoFloat 14s ease-in-out infinite;animation-delay:-5s;}
.geo-diamond{width:56px;height:56px;border:1px solid rgba(196,164,90,.22);bottom:180px;right:140px;animation:geoFloatD 8s ease-in-out infinite;animation-delay:-3s;}
.geo-line{width:1px;height:110px;background:linear-gradient(to bottom,transparent,rgba(196,164,90,.28),transparent);top:32%;left:72px;animation:geoFloat 10s ease-in-out infinite;animation-delay:-7s;}
@keyframes geoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes geoFloatD{0%,100%{transform:rotate(45deg) translateY(0)}50%{transform:rotate(45deg) translateY(-12px)}}
#hero-content{position:relative;z-index:10;text-align:center;padding:2rem 1.5rem;max-width:720px;opacity:0;transform:translateY(28px);transition:opacity 1s ease .5s,transform 1s ease .5s;}
#hero-content.visible{opacity:1;transform:translateY(0);}
.overline{font-family:'Raleway',sans-serif;font-size:10px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin-bottom:.6rem;display:block;}
.hero-name{font-family:'Cormorant Garamond',serif;font-size:clamp(4.5rem,12vw,9rem);font-weight:400;line-height:.95;color:var(--cream);}
.hero-divider{width:40px;height:1px;background:rgba(196,164,90,.5);margin:1.4rem auto 1.2rem;}
.hero-info{font-family:'Raleway',sans-serif;font-size:.7rem;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:.9rem;}
.hero-info .sep{width:3px;height:3px;background:var(--gold);border-radius:50%;opacity:.6;}
#clock{font-family:'Cormorant Garamond',serif;font-size:clamp(1.1rem,3vw,1.6rem);font-weight:300;letter-spacing:.18em;color:var(--cream);opacity:.75;margin-bottom:1.4rem;}
.clima-label{font-family:'Raleway',sans-serif;font-size:.62rem;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);opacity:.7;display:flex;align-items:center;justify-content:center;gap:7px;}
.clima-dot{width:6px;height:6px;background:var(--gold);border-radius:50%;animation:pulse 2.2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
.scroll-indicator{position:absolute;bottom:2.2rem;left:50%;transform:translateX(-50%);z-index:10;display:flex;flex-direction:column;align-items:center;gap:7px;animation:sP 2.8s ease-in-out infinite;}
.scroll-indicator span{font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-family:'Raleway',sans-serif;}
.scroll-line{width:1px;height:38px;background:linear-gradient(to bottom,var(--gold),transparent);}
@keyframes sP{0%,100%{opacity:.28;transform:translateX(-50%) translateY(0)}50%{opacity:.65;transform:translateX(-50%) translateY(7px)}}
#loading-state{position:absolute;inset:0;background:var(--navy-deep);display:flex;align-items:center;justify-content:center;z-index:20;transition:opacity .9s ease;}
#loading-state.hidden{opacity:0;pointer-events:none;}
.loading-logo{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:300;letter-spacing:.35em;color:var(--gold);text-transform:uppercase;animation:fIO 1.9s ease-in-out infinite;}
@keyframes fIO{0%,100%{opacity:.15}50%{opacity:.75}}

/* BARRA DE TRADUÇÃO NO HERO */
#hero-translator {
  position: absolute;
  top: 2rem;
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  width: min(520px, 88vw);
  opacity: 0;
  animation: htAppear 1s ease 1.4s forwards;
}
@keyframes htAppear { to { opacity: 1; } }
#hero-translator.visible { opacity: 1; animation: none; }

.ht-wrap {
  display: flex;
  align-items: center;
  background: rgba(5,13,26,0.28);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 50px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  padding: 5px 5px 5px 18px;
  gap: 8px;
  transition: border-color .3s, background .3s;
}
.ht-wrap:focus-within {
  border-color: rgba(196,164,90,.4);
  background: rgba(5,13,26,0.42);
}

/* Botão de direção */
.ht-dir {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
  cursor: pointer;
  opacity: .65;
  transition: opacity .2s;
}
.ht-dir:hover { opacity: 1; }
.ht-dir-from, .ht-dir-to {
  font-family: 'Raleway', sans-serif;
  font-size: 8.5px;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--cream);
}
.ht-dir-arrow {
  color: rgba(255,255,255,.5);
  font-size: 11px;
  line-height: 1;
  transition: transform .3s ease;
}
.ht-dir.flipped .ht-dir-arrow { transform: rotate(180deg); }

/* Divisor */
.ht-sep {
  width: 1px;
  height: 14px;
  background: rgba(255,255,255,.12);
  flex-shrink: 0;
}

/* Campo de texto */
#ht-input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  font-family: 'Raleway', sans-serif;
  font-size: .76rem;
  font-weight: 300;
  color: var(--cream);
  letter-spacing: .04em;
  min-width: 0;
}
#ht-input::placeholder {
  color: rgba(255,255,255,.25);
  font-style: italic;
  font-size: .72rem;
}

/* Botão traduzir */
.ht-btn {
  flex-shrink: 0;
  position: relative;
  background: rgba(196,164,90,.15);
  border: 1px solid rgba(196,164,90,.3);
  border-radius: 40px;
  padding: .45rem 1.2rem;
  font-family: 'Raleway', sans-serif;
  font-size: .6rem;
  font-weight: 600;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--gold-pale);
  cursor: pointer;
  transition: background .2s, border-color .2s;
  white-space: nowrap;
}
.ht-btn:hover { background: rgba(196,164,90,.28); border-color: rgba(196,164,90,.55); }
.ht-btn:disabled { opacity: .4; cursor: wait; }

/* Ponto orbital */
.ht-btn-ring {
  position: absolute;
  inset: -5px;
  border-radius: 40px;
  pointer-events: none;
  animation: htOrbit 2.4s linear infinite;
}
.ht-btn-ring::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 0;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--gold);
  transform: translateY(-50%);
  box-shadow: 0 0 6px 2px rgba(196,164,90,.5);
}
@keyframes htOrbit {
  0%   { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
.ht-btn.loading .ht-btn-ring { animation-duration: .8s; }
.ht-btn-txt { line-height: 1; }

/* Resultado */
#ht-result {
  margin-top: 8px;
  padding: .85rem 1.2rem;
  background: rgba(5,13,26,.6);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 14px;
  backdrop-filter: blur(14px);
  display: none;
  animation: htFadeIn .3s ease;
}
@keyframes htFadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
#ht-result.visible { display: block; }

.ht-result-main {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.4rem;
  font-weight: 300;
  color: var(--cream);
  margin-bottom: .5rem;
  line-height: 1.2;
}
.ht-result-alts {
  font-family: 'Raleway', sans-serif;
  font-size: .66rem;
  color: rgba(255,255,255,.45);
  letter-spacing: .05em;
}
.ht-result-alts span {
  color: var(--gold-pale);
  opacity: .7;
}
.ht-loading {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: .2rem 0;
}
.ht-spinner {
  width: 14px; height: 14px;
  border: 1.5px solid rgba(196,164,90,.2);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: htSpin .7s linear infinite;
}
@keyframes htSpin { to { transform: rotate(360deg); } }
.ht-loading span {
  font-family: 'Raleway', sans-serif;
  font-size: .63rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
}
/* Fechar resultado */
.ht-close {
  float: right;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: rgba(255,255,255,.08);
  border: none; color: var(--muted);
  cursor: pointer; font-size: 10px;
  display: flex; align-items: center; justify-content: center;
  margin-left: 8px; transition: background .2s;
}
.ht-close:hover { background: rgba(255,255,255,.18); }

/* MUSIC PLAYER */
#music-player {
  position: absolute;
  top: 2rem;
  right: 2rem;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 8px;
  opacity: 0;
  animation: htAppear 1s ease 1.8s forwards;
}

#music-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(5,13,26,.3);
  border: 1px solid rgba(255,255,255,.15);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background .2s, border-color .2s;
  color: rgba(255,255,255,.6);
}
#music-btn:hover {
  background: rgba(5,13,26,.5);
  border-color: rgba(196,164,90,.4);
  color: var(--gold-pale);
}
#music-btn.playing { border-color: rgba(196,164,90,.35); color: var(--gold-pale); }

/* Barras de equalizer animadas */
.eq-bars {
  display: flex;
  align-items: flex-end;
  gap: 2px;
  height: 12px;
}
.eq-bar {
  width: 3px;
  border-radius: 2px;
  background: var(--gold);
  opacity: 0;
  transition: opacity .3s;
}
#music-btn.playing .eq-bar { opacity: 1; }
.eq-bar:nth-child(1) { animation: eqAnim 1.1s ease-in-out infinite; }
.eq-bar:nth-child(2) { animation: eqAnim  .8s ease-in-out infinite .15s; }
.eq-bar:nth-child(3) { animation: eqAnim  .9s ease-in-out infinite .05s; }
.eq-bar:nth-child(4) { animation: eqAnim 1.2s ease-in-out infinite .25s; }
@keyframes eqAnim {
  0%,100% { height: 3px; }
  50%      { height: 12px; }
}

#music-label {
  font-family: 'Raleway', sans-serif;
  font-size: .58rem;
  font-weight: 500;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: rgba(255,255,255,.35);
  transition: color .3s;
  white-space: nowrap;
}
#music-player.playing #music-label { color: rgba(196,164,90,.6); }

/* YouTube iframe escondido */
#yt-frame { display: none; }

/* ABAS ESTILO CHROME */
#chrome-tabbar {
  background: #E8E4DF;
  display: flex;
  align-items: flex-end;
  padding: 10px 12px 0;
  gap: 2px;
  min-height: 44px;
  overflow-x: auto;
  scrollbar-width: none;
  position: relative;
  z-index: 90;
}
#chrome-tabbar::-webkit-scrollbar { display: none; }

/* Cada aba */
.ctab {
  position: relative;
  display: flex;
  align-items: center;
  gap: 7px;
  height: 34px;
  min-width: 150px;
  max-width: 230px;
  padding: 0 10px 0 12px;
  border-radius: 8px 8px 0 0;
  background: #D0CBC4;
  cursor: pointer;
  flex-shrink: 0;
  transition: background .15s, box-shadow .15s;
  z-index: 1;
}
.ctab:hover {
  background: #DEDAD4;
  box-shadow: 0 -2px 8px rgba(0,0,0,.1);
}
.ctab.active {
  background: #F5F2EE;
  z-index: 3;
  box-shadow:
    -3px -3px 8px rgba(0,0,0,.12),
    3px -3px 8px rgba(0,0,0,.08);
}

/* Curvas nas laterais da aba ativa */
.ctab::before,
.ctab::after {
  content: '';
  position: absolute;
  bottom: 0;
  width: 16px;
  height: 16px;
  pointer-events: none;
  z-index: 4;
}
.ctab::before {
  left: -15px;
  background: radial-gradient(circle at 100% 0%, transparent 69%, #F5F2EE 70%);
  opacity: 0;
}
.ctab::after {
  right: -15px;
  background: radial-gradient(circle at 0% 0%, transparent 69%, #F5F2EE 70%);
  opacity: 0;
}
.ctab.active::before,
.ctab.active::after { opacity: 1; }

/* Favicon */
.ctab-fav {
  width: 16px; height: 16px;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  color: rgba(0,0,0,.35);
}
.ctab.active .ctab-fav          { color: #888; }
#ctab-planner.active .ctab-fav  { color: #7c6ea0; }
#ctab-flash.active   .ctab-fav  { color: #2196F3; }
#ctab-dash.active    .ctab-fav  { color: var(--gold); }
#ctab-caderno.active .ctab-fav  { color: var(--gold); }

/* Título */
.ctab-title {
  font-family: -apple-system, 'Segoe UI', sans-serif;
  font-size: .76rem;
  font-weight: 400;
  color: rgba(0,0,0,.5);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  min-width: 0;
  line-height: 1;
}
.ctab.active .ctab-title { color: #1a1a1a; font-weight: 500; }

/* Botão fechar */
.ctab-x {
  width: 16px; height: 16px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  color: transparent;
  font-size: 10px;
  transition: background .15s, color .15s;
  line-height: 1;
}
.ctab:hover .ctab-x { color: rgba(0,0,0,.4); }
.ctab:hover .ctab-x:hover { background: rgba(0,0,0,.1); color: rgba(0,0,0,.7); }
.ctab.active:hover .ctab-x { color: rgba(0,0,0,.45); }
.ctab.active:hover .ctab-x:hover { background: rgba(0,0,0,.1); color: rgba(0,0,0,.8); }

/* Linha que funde a aba ativa com o painel */
#chrome-tabbar::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 1px;
  background: #F5F2EE;
  z-index: 2;
  pointer-events: none;
}

/* Painel */
#tab-panels { background: #F5F2EE; }
.tab-panel  { display: none; }
.tab-panel.active { display: block; }

/* ═══════════════════════════════════
   DASHBOARD
═══════════════════════════════════ */
#dash-body {
  background: #F5F2EE;
}

/* Saudação */
.dash-greeting {
  padding: 2.5rem 2.5rem 0;
  max-width: 1100px;
  margin: 0 auto;
}
.dash-greeting-time {
  font-family: 'Raleway', sans-serif;
  font-size: .68rem; font-weight: 600;
  letter-spacing: .22em; text-transform: uppercase;
  color: var(--gold); margin-bottom: .4rem;
  display: flex; align-items: center; gap: 8px;
}
.dash-greeting-time::before {
  content: ''; width: 24px; height: 1px;
  background: var(--gold); opacity: .5;
}
.dash-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(1.8rem, 4vw, 2.8rem);
  font-weight: 300; color: #1a1a2e; line-height: 1.1;
}
.dash-name em { font-style: italic; color: var(--gold); }
.dash-streak-row {
  display: flex; align-items: center; gap: 10px;
  margin-top: .8rem;
}
.streak-badge {
  display: inline-flex; align-items: center; gap: 5px;
  background: #fff8ee;
  border: 1px solid rgba(196,164,90,.25);
  border-radius: 20px;
  padding: .3rem .9rem;
}
.streak-badge svg { color: #ff7043; }
.streak-badge span {
  font-family: 'Raleway', sans-serif;
  font-size: .65rem; font-weight: 600;
  letter-spacing: .08em; color: #ff7043;
}
.last-seen {
  font-family: 'Raleway', sans-serif;
  font-size: .62rem; color: #bbb;
}

/* Seção */
.dash-section {
  padding: 2rem 2.5rem;
  max-width: 1100px;
  margin: 0 auto;
}
.dash-section-label {
  font-family: 'Raleway', sans-serif;
  font-size: 8px; font-weight: 700;
  letter-spacing: .28em; text-transform: uppercase;
  color: #bbb; margin-bottom: 1rem;
  display: flex; align-items: center; gap: 10px;
}
.dash-section-label::after {
  content: ''; flex: 1; height: 1px;
  background: #e8e4df;
}

/* Grid métricas */
.metrics-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: .8rem;
}
@media(max-width:800px){ .metrics-grid { grid-template-columns: repeat(2,1fr); } }

.metric-card {
  background: #fff;
  border: 1.5px solid #ece8e2;
  border-radius: 16px;
  padding: 1.3rem 1.3rem 1.1rem;
  position: relative;
  overflow: hidden;
  transition: transform .18s, box-shadow .18s;
  cursor: default;
}
.metric-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  border-radius: 16px 16px 0 0;
}
.metric-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.08); }

.mc-accent-gold::before  { background: var(--gold); }
.mc-accent-teal::before  { background: #00BCD4; }
.mc-accent-purple::before{ background: #7c6ea0; }
.mc-accent-green::before { background: #4CAF50; }

.mc-top {
  display: flex; align-items: flex-start;
  justify-content: space-between; margin-bottom: .9rem;
}
.mc-icon {
  width: 38px; height: 38px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; flex-shrink: 0;
}
.mc-icon-gold   { background: linear-gradient(135deg, #C4A45A, #D4BA7A); }
.mc-icon-teal   { background: linear-gradient(135deg, #00ACC1, #00BCD4); }
.mc-icon-purple { background: linear-gradient(135deg, #6a5acd, #7c6ea0); }
.mc-icon-green  { background: linear-gradient(135deg, #43A047, #4CAF50); }

.mc-trend {
  font-family: 'Raleway', sans-serif;
  font-size: .6rem; font-weight: 600;
  padding: .2rem .55rem;
  border-radius: 20px;
  white-space: nowrap;
}
.mc-trend.up   { background: #e8f5e9; color: #388e3c; }
.mc-trend.info { background: #e3f2fd; color: #1565c0; }

.mc-num {
  font-family: 'Cormorant Garamond', serif;
  font-size: 2.4rem; font-weight: 300;
  color: #1a1a2e; line-height: 1;
  margin-bottom: .25rem;
}
.mc-label {
  font-family: 'Raleway', sans-serif;
  font-size: .62rem; font-weight: 700;
  letter-spacing: .14em; text-transform: uppercase;
  color: #aaa;
}
.mc-sub {
  font-family: 'Raleway', sans-serif;
  font-size: .6rem; color: #ccc; margin-top: .2rem;
}

/* Mini barra de progresso no card */
.mc-bar {
  height: 3px; background: #f0ece8;
  border-radius: 3px; margin-top: .8rem;
  overflow: hidden;
}
.mc-bar-fill {
  height: 100%; border-radius: 3px;
  transition: width 1s ease .3s;
}

/* Layout principal: radar + gráfico barras */
.dash-main-grid {
  display: grid;
  grid-template-columns: 1fr 1.4fr;
  gap: 1rem;
}
@media(max-width:800px){ .dash-main-grid { grid-template-columns: 1fr; } }

.dash-card {
  background: #fff;
  border: 1.5px solid #ece8e2;
  border-radius: 16px;
  padding: 1.4rem 1.5rem;
}
.dash-card-ttl {
  font-family: 'Raleway', sans-serif;
  font-size: 8px; font-weight: 700;
  letter-spacing: .26em; text-transform: uppercase;
  color: #bbb; margin-bottom: 1.2rem;
}

/* Radar */
#radar-canvas { display: block; margin: 0 auto; }

/* Barra semanal */
.week-bars {
  display: flex; align-items: flex-end;
  gap: 10px; height: 120px;
}
.wb-col {
  display: flex; flex-direction: column;
  align-items: center; gap: 5px; flex: 1;
}
.wb-bar {
  width: 100%; border-radius: 6px 6px 0 0;
  background: linear-gradient(to top, #C4A45A, #E8D9B0);
  min-height: 4px;
  transition: height .8s ease;
  position: relative;
}
.wb-bar.current {
  background: linear-gradient(to top, #0B1D3A, #163158);
}
.wb-lbl {
  font-family: 'Raleway', sans-serif;
  font-size: .55rem; font-weight: 600;
  letter-spacing: .08em; text-transform: uppercase;
  color: #ccc;
}
.wb-col.current .wb-lbl { color: #0B1D3A; font-weight: 700; }

/* Distribuição por seção — donut simplificado */
.section-dist {
  display: flex; flex-direction: column; gap: .6rem;
}
.sd-item {
  display: grid;
  grid-template-columns: 80px 1fr 28px;
  align-items: center; gap: 8px;
}
.sd-label {
  font-family: 'Raleway', sans-serif;
  font-size: .65rem; font-weight: 600;
  letter-spacing: .08em; color: #555;
  text-align: right;
}
.sd-bar {
  height: 6px; background: #f0ece8;
  border-radius: 6px; overflow: hidden;
}
.sd-fill {
  height: 100%; border-radius: 6px;
  transition: width 1s ease .4s;
}
.sd-num {
  font-family: 'Raleway', sans-serif;
  font-size: .62rem; font-weight: 700;
  color: #aaa; text-align: right;
}

/* Feed de atividades */
.feed {
  display: flex; flex-direction: column; gap: 0;
}
.feed-item {
  display: flex; align-items: flex-start; gap: 12px;
  padding: .75rem 0;
  border-bottom: 1px solid #f5f2ee;
  animation: feedIn .4s ease forwards;
  opacity: 0;
}
@keyframes feedIn { to { opacity: 1; } }
.feed-dot-wrap {
  display: flex; flex-direction: column;
  align-items: center; gap: 0; flex-shrink: 0;
  padding-top: 3px;
}
.feed-dot {
  width: 10px; height: 10px; border-radius: 50%;
  flex-shrink: 0;
}
.feed-line {
  width: 1.5px; flex: 1; background: #f0ece8;
  margin-top: 3px; min-height: 16px;
}
.feed-content { flex: 1; min-width: 0; }
.feed-action {
  font-family: 'Raleway', sans-serif;
  font-size: .7rem; color: #333; line-height: 1.4;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.feed-action strong { color: #1a1a2e; font-weight: 600; }
.feed-meta {
  font-family: 'Raleway', sans-serif;
  font-size: .58rem; color: #bbb; margin-top: .2rem;
  display: flex; align-items: center; gap: 5px;
}
.feed-tag {
  display: inline-block;
  font-size: .55rem; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase;
  padding: 1px 6px; border-radius: 10px;
}

/* Mapa de calor semanal */
.heatmap-row {
  display: flex; gap: 4px; flex-wrap: wrap;
  margin-bottom: .5rem;
}
.hm-cell {
  width: 14px; height: 14px; border-radius: 3px;
  transition: transform .15s;
  cursor: default;
}
.hm-cell:hover { transform: scale(1.3); }
.hm-0 { background: #f0ece8; }
.hm-1 { background: #e8d9b0; }
.hm-2 { background: #d4ba7a; }
.hm-3 { background: #c4a45a; }
.hm-4 { background: #0B1D3A; }
.hm-legend {
  display: flex; align-items: center; gap: 5px;
  margin-top: .4rem;
  font-family: 'Raleway', sans-serif;
  font-size: .58rem; color: #bbb;
}

/* Bottom grid */
.dash-bottom-grid {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 1rem;
}
@media(max-width:800px){ .dash-bottom-grid { grid-template-columns: 1fr; } }

/* CADERNO NAV */
#caderno-nav{position:sticky;top:0;z-index:100;display:none;background:rgba(245,242,238,.96);backdrop-filter:blur(12px);border-bottom:1.5px solid #e8e4df;padding:0 2rem;}
.nav-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:1rem;height:60px;}
.nav-brand{display:none;}
.nav-brand em{font-style:italic;color:var(--gold);}
.nav-tabs{display:flex;align-items:center;flex:1;overflow-x:auto;scrollbar-width:none;}
.nav-tabs::-webkit-scrollbar{display:none;}
.ntab{font-family:'Raleway',sans-serif;font-size:.67rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#aaa;background:transparent;border:none;border-bottom:2px solid transparent;padding:0 1rem;height:60px;cursor:pointer;transition:color .2s,border-color .2s;white-space:nowrap;flex-shrink:0;}
.ntab:hover{color:#555;}
.ntab.active{color:#1a1a2e;border-bottom-color:var(--gold);}
.ntab-nova{color:var(--gold)!important;border:1.5px dashed rgba(196,164,90,.35)!important;border-radius:20px!important;height:auto!important;padding:.25rem .8rem!important;margin-left:.5rem;font-size:.6rem!important;}
.nav-actions{display:flex;align-items:center;gap:.6rem;flex-shrink:0;}
.nav-sw{position:relative;}
.nav-sw svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#aaa;pointer-events:none;}
#search-input{background:#fff;border:1.5px solid #e0dbd4;border-radius:20px;padding:.45rem .9rem .45rem 2.2rem;font-family:'Raleway',sans-serif;font-size:.72rem;color:#1a1a2e;outline:none;width:200px;transition:border-color .2s,width .3s;}
#search-input:focus{border-color:var(--gold);width:240px;}
#search-input::placeholder{color:#bbb;}
.btn-novo{display:flex;align-items:center;gap:6px;background:#1a1a2e;border:none;border-radius:20px;padding:.45rem 1rem;font-family:'Raleway',sans-serif;font-size:.63rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#fff;cursor:pointer;white-space:nowrap;transition:background .2s;}
.btn-novo:hover{background:#163158;}
.btn-dl{width:34px;height:34px;border-radius:50%;border:1.5px solid #e0dbd4;background:#fff;display:flex;align-items:center;justify-content:center;color:#999;cursor:pointer;transition:all .2s;}
.btn-dl:hover{border-color:var(--gold);color:var(--gold);}

/* CADERNO BODY */
#caderno{background:#F5F2EE;min-height:100vh;display:none;}
#caderno-body{max-width:1100px;margin:0 auto;padding:2.5rem 2rem 6rem;}
.ec{font-family:'Raleway',sans-serif;font-size:.68rem;color:#bbb;margin-bottom:1.5rem;}
.ec strong{color:#888;}

/* CARDS */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;}
.card{background:#fff;border:1.5px solid #ece8e2;border-radius:16px;padding:1.2rem 1.3rem 1rem;position:relative;animation:cR .35s ease forwards;opacity:0;transform:translateY(8px);box-shadow:0 1px 4px rgba(0,0,0,.04);transition:transform .18s,border-color .18s,box-shadow .18s;}
@keyframes cR{to{opacity:1;transform:translateY(0)}}
.card:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 8px 24px rgba(196,164,90,.12);}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:.6rem;}
.ctag{display:inline-block;font-family:'Raleway',sans-serif;font-size:7px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;border-radius:20px;padding:2px 9px;}
.ctag.vocabulario{background:#FFF3DC;color:#9A7B2E;}
.ctag.frases{background:#E0F7FA;color:#00838F;}
.ctag.termos{background:#EDE7F6;color:#6A3FA0;}
.ctag.anotacoes{background:#F1F8E9;color:#558B2F;}
.ctag.custom{background:#FCE4EC;color:#C2185B;}
.card-acts{display:flex;gap:4px;opacity:0;transition:opacity .18s;}
.card:hover .card-acts{opacity:1;}
.cbtn{width:26px;height:26px;border-radius:8px;border:1.5px solid #e8e4e0;background:#fafafa;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#bbb;transition:all .15s;}
.cbtn:hover{border-color:var(--gold);color:var(--gold);background:#fff8ee;}
.cbtn.del:hover{border-color:#ef5350;color:#ef5350;background:#fff5f5;}
.c-termo{font-family:'Cormorant Garamond',serif;font-size:1.25rem;color:#1a1a2e;line-height:1.2;margin-bottom:.25rem;}
.c-trad{font-family:'Raleway',sans-serif;font-size:.7rem;font-weight:500;color:var(--gold);margin-bottom:.5rem;display:flex;align-items:center;gap:5px;}
.c-trad::before{content:'';width:10px;height:1px;background:var(--gold);opacity:.5;flex-shrink:0;}
.c-ex{font-family:'Raleway',sans-serif;font-size:.67rem;color:#999;font-style:italic;line-height:1.6;border-top:1px solid #f0ece6;padding-top:.5rem;margin-top:.25rem;}
.c-date{font-family:'Raleway',sans-serif;font-size:.58rem;color:#ccc;margin-top:.65rem;}
.empty-st{grid-column:1/-1;text-align:center;padding:5rem 2rem;}
.empty-ic{width:72px;height:72px;border-radius:50%;background:#ece8e2;margin:0 auto 1.2rem;display:flex;align-items:center;justify-content:center;color:#ccc;}
.empty-st h3{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:300;color:#555;margin-bottom:.4rem;}
.empty-st p{font-family:'Raleway',sans-serif;font-size:.72rem;color:#aaa;}
.empty-cta{display:inline-flex;align-items:center;gap:6px;background:#1a1a2e;color:#fff;border:none;border-radius:20px;padding:.55rem 1.2rem;font-family:'Raleway',sans-serif;font-size:.63rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;margin-top:1.2rem;}

/* MODAL */
.modal-bd{position:fixed;inset:0;background:rgba(26,26,46,.5);backdrop-filter:blur(8px);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;}
.modal-bd.open{opacity:1;pointer-events:all;}
.modal{background:#fff;border-radius:20px;padding:0;width:100%;max-width:500px;box-shadow:0 24px 80px rgba(0,0,0,.18);transform:translateY(16px);transition:transform .25s;overflow:hidden;}
.modal-bd.open .modal{transform:translateY(0);}
.modal-top{background:#1a1a2e;padding:1.4rem 1.8rem;display:flex;align-items:center;justify-content:space-between;}
.modal-ttl{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:300;color:#fff;}
.modal-x{width:28px;height:28px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:transparent;color:rgba(255,255,255,.5);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;}
.modal-body{padding:1.6rem 1.8rem 1.8rem;}
.fg{margin-bottom:1rem;}
.flbl{display:block;font-family:'Raleway',sans-serif;font-size:8px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:#aaa;margin-bottom:.4rem;}
.finp,.fsel,.ftxt{width:100%;background:#fafafa;border:1.5px solid #e8e4e0;border-radius:10px;padding:.65rem .9rem;font-family:'Raleway',sans-serif;font-size:.76rem;color:#1a1a2e;outline:none;transition:border-color .2s,box-shadow .2s;}
.finp:focus,.fsel:focus,.ftxt:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(196,164,90,.1);background:#fff;}
.finp::placeholder,.ftxt::placeholder{color:#ccc;}
.fsel{appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23C4A45A' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center;padding-right:2rem;cursor:pointer;}
.ftxt{resize:vertical;min-height:80px;line-height:1.5;}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;}
.fhint{font-family:'Raleway',sans-serif;font-size:.61rem;color:#ccc;margin-top:.25rem;font-style:italic;}
.btn-save{width:100%;background:#1a1a2e;border:none;border-radius:10px;padding:.8rem;font-family:'Raleway',sans-serif;font-size:.63rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#fff;cursor:pointer;margin-top:.4rem;}
.btn-save:hover{background:#163158;}

/* TOUR */
#tour-ov{display:none;position:fixed;inset:0;z-index:9999;background:rgba(26,26,46,.6);backdrop-filter:blur(2px);}
#tour-ov.on{display:flex;align-items:center;justify-content:center;}
#tour-card{background:#fff;border-radius:20px;padding:2rem;max-width:340px;width:90%;box-shadow:0 24px 60px rgba(0,0,0,.2);text-align:center;}
.t-ico{width:52px;height:52px;margin:0 auto .9rem;display:flex;align-items:center;justify-content:center;background:rgba(196,164,90,.08);border:1.5px solid rgba(196,164,90,.2);border-radius:14px;color:#1a1a2e;}
.t-step{font-family:'Raleway',sans-serif;font-size:8px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin-bottom:.5rem;}
.t-ttl{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:300;color:#1a1a2e;margin-bottom:.5rem;}
.t-desc{font-family:'Raleway',sans-serif;font-size:.72rem;color:#666;line-height:1.65;margin-bottom:1.4rem;}
.t-dots{display:flex;justify-content:center;gap:5px;margin-bottom:1.2rem;}
.t-dot{width:6px;height:6px;border-radius:50%;background:#e0dbd4;}
.t-dot.on{background:var(--gold);}
.t-btns{display:flex;justify-content:center;gap:.8rem;align-items:center;}
.t-skip{font-family:'Raleway',sans-serif;font-size:.62rem;color:#bbb;background:none;border:none;cursor:pointer;text-transform:uppercase;}
.t-next{background:#1a1a2e;color:#fff;border:none;border-radius:10px;padding:.55rem 1.3rem;font-family:'Raleway',sans-serif;font-size:.63rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;}

/* PLANNER */
.pl-header{display:flex;align-items:center;gap:1rem;margin-bottom:1.8rem;flex-wrap:wrap;}
.pl-week{font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-weight:300;color:#1a1a2e;flex:1;}
.pl-nav{display:flex;gap:4px;}
.pl-nav-btn{width:30px;height:30px;border-radius:8px;border:1.5px solid #e8e4e0;background:#fff;color:#555;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.pl-nav-btn:hover{border-color:var(--gold);color:var(--gold);}
.pl-sug{display:flex;align-items:center;gap:6px;background:#1a1a2e;color:#fff;border:none;border-radius:20px;padding:.45rem 1rem;font-family:'Raleway',sans-serif;font-size:.6rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;}
.pl-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:.6rem;margin-bottom:1.8rem;}
.pl-day{background:#fff;border:1.5px solid #ece8e2;border-radius:12px;padding:.75rem .6rem;min-height:150px;position:relative;transition:border-color .2s;}
.pl-day.today{border-color:var(--gold);box-shadow:0 4px 16px rgba(196,164,90,.15);}
.pl-dlbl{font-family:'Raleway',sans-serif;font-size:7px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#ccc;margin-bottom:.2rem;}
.pl-dnum{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:300;color:#1a1a2e;margin-bottom:.6rem;}
.pl-day.today .pl-dnum{color:var(--gold);}
.pl-acts{display:flex;flex-wrap:wrap;gap:4px;}
.a-ico{position:relative;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s,box-shadow .15s;background:#F8F6F3;border:1.5px solid #e0dbd4;}
.a-ico:hover{transform:scale(1.08);box-shadow:0 3px 10px rgba(0,0,0,.1);}
.a-ico.done{opacity:.35;filter:grayscale(.3);}
.a-ico.done::after{content:'v';position:absolute;top:-4px;right:-4px;width:14px;height:14px;background:#4caf50;border-radius:50%;font-size:8px;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Raleway',sans-serif;font-weight:700;}
.a-ico .tip{display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;font-family:'Raleway',sans-serif;font-size:.58rem;white-space:nowrap;padding:4px 10px;border-radius:6px;z-index:50;pointer-events:none;}
.a-ico:hover .tip{display:block;}
.a-add{width:28px;height:28px;border-radius:8px;border:1.5px dashed #d0cbc4;background:transparent;color:#ccc;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.a-add:hover{border-color:var(--gold);color:var(--gold);}
.a-picker{display:none;position:absolute;top:0;left:calc(100% + 8px);background:#fff;border:1.5px solid #ece8e2;border-radius:12px;padding:.8rem;box-shadow:0 8px 32px rgba(0,0,0,.14);z-index:100;width:200px;}
.a-picker.open{display:block;}
.p-ttl{font-family:'Raleway',sans-serif;font-size:7.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#aaa;margin-bottom:.6rem;}
.p-items{display:flex;flex-wrap:wrap;gap:6px;}
.p-item{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#F8F6F3;border:1.5px solid #e0dbd4;transition:all .15s;position:relative;}
.p-item:hover{border-color:var(--gold);transform:scale(1.08);}
.p-item .tip{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;font-family:'Raleway',sans-serif;font-size:.58rem;white-space:nowrap;padding:3px 8px;border-radius:5px;z-index:200;pointer-events:none;}
.p-item:hover .tip{display:block;}
.pl-legend{background:#fff;border:1.5px solid #ece8e2;border-radius:12px;padding:1.1rem 1.2rem;}
.leg-ttl{font-family:'Raleway',sans-serif;font-size:8px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:#bbb;margin-bottom:.8rem;}
.leg-items{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;}
.leg-item{display:flex;align-items:center;gap:8px;}
.leg-ico{width:36px;height:36px;border-radius:10px;background:#F8F6F3;border:1.5px solid #e0dbd4;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.leg-txt{font-family:'Raleway',sans-serif;font-size:.65rem;color:#555;line-height:1.3;min-width:0;}

/* ═══════════════════════════════════
   FLASHCARDS
═══════════════════════════════════ */

/* Layout geral */
#flash-body {
  background: #F5F2EE;
  min-height: 60vh;
}
.flash-wrap {
  max-width: 860px;
  margin: 0 auto;
  padding: 2.5rem 2rem 4rem;
}

/* Header */
.flash-hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 2rem;
  flex-wrap: wrap;
  gap: 1rem;
}
.flash-hdr-left {}
.flash-hdr-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.6rem;
  font-weight: 300;
  color: #1a1a2e;
  line-height: 1;
}
.flash-hdr-title em { font-style: italic; color: var(--gold); }
.flash-hdr-sub {
  font-family: 'Raleway', sans-serif;
  font-size: .62rem;
  color: #bbb;
  letter-spacing: .08em;
  margin-top: .3rem;
}

/* Filtros de seção */
.flash-filters {
  display: flex;
  align-items: center;
  gap: .5rem;
  flex-wrap: wrap;
}
.ff-label {
  font-family: 'Raleway', sans-serif;
  font-size: 8px;
  font-weight: 700;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: #ccc;
  margin-right: .3rem;
}
.ff-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: 'Raleway', sans-serif;
  font-size: .62rem;
  font-weight: 600;
  letter-spacing: .1em;
  border: 1.5px solid #e0dbd4;
  background: #fff;
  border-radius: 20px;
  padding: .3rem .85rem .3rem .6rem;
  cursor: pointer;
  color: #aaa;
  transition: all .2s;
}
.ff-btn svg { flex-shrink: 0; transition: color .2s; }
.ff-btn.on { background: #1a1a2e; border-color: #1a1a2e; color: #fff; }
.ff-btn.on svg { color: #fff; }
.ff-btn:hover:not(.on) { border-color: #aaa; color: #555; }

/* Modo de estudo */
.flash-modes {
  display: flex;
  gap: .4rem;
  background: #fff;
  border: 1.5px solid #e8e4e0;
  border-radius: 20px;
  padding: 3px;
}
.fm-btn {
  font-family: 'Raleway', sans-serif;
  font-size: .6rem;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  border: none;
  background: transparent;
  border-radius: 16px;
  padding: .32rem .9rem;
  cursor: pointer;
  color: #aaa;
  transition: all .2s;
  display: flex;
  align-items: center;
  gap: 5px;
}
.fm-btn.on {
  background: #1a1a2e;
  color: #fff;
}
.fm-btn svg { flex-shrink: 0; }

/* Progresso */
.flash-progress {
  margin-bottom: 1.8rem;
}
.fp-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: .5rem;
}
.fp-count {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1rem;
  font-weight: 300;
  color: #1a1a2e;
}
.fp-pct {
  font-family: 'Raleway', sans-serif;
  font-size: .62rem;
  font-weight: 600;
  color: #bbb;
}
.fp-bar {
  height: 4px;
  background: #e8e4e0;
  border-radius: 4px;
  overflow: hidden;
}
.fp-fill {
  height: 100%;
  background: linear-gradient(to right, #C4A45A, #D4BA7A);
  border-radius: 4px;
  transition: width .5s ease;
}

/* Score badges */
.fp-scores {
  display: flex;
  gap: .6rem;
  margin-top: .7rem;
}
.fp-score-badge {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: .28rem .75rem;
  border-radius: 20px;
  font-family: 'Raleway', sans-serif;
  font-size: .65rem;
  font-weight: 700;
}
.fp-score-badge.green { background: #e8f5e9; color: #388e3c; }
.fp-score-badge.orange { background: #fff3e0; color: #e65100; }
.fp-score-badge svg { flex-shrink: 0; }

/* CARD 3D */
.fc-scene {
  width: 100%;
  height: 260px;
  perspective: 1400px;
  margin-bottom: 1.8rem;
  cursor: pointer;
}
.fc-inner {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform .6s cubic-bezier(.4,0,.2,1);
}
.fc-scene.flipped .fc-inner {
  transform: rotateY(180deg);
}

/* Face base */
.fc-face {
  position: absolute;
  inset: 0;
  border-radius: 20px;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem 2.5rem;
  text-align: center;
  overflow: hidden;
}

/* Frente — branca com detalhe */
.fc-front {
  background: #fff;
  border: 1.5px solid #ece8e2;
  box-shadow: 0 8px 40px rgba(0,0,0,.08), 0 2px 8px rgba(0,0,0,.04);
}
/* Padrão de pontos sutil na frente */
.fc-front::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: radial-gradient(rgba(196,164,90,.06) 1px, transparent 1px);
  background-size: 24px 24px;
  pointer-events: none;
}

/* Verso — navy rico */
.fc-back {
  background: linear-gradient(135deg, #0B1D3A 0%, #163158 100%);
  border: 1.5px solid rgba(196,164,90,.2);
  box-shadow: 0 8px 40px rgba(0,0,0,.22), 0 2px 8px rgba(0,0,0,.1);
  transform: rotateY(180deg);
}
/* Detalhe geométrico no verso */
.fc-back::before {
  content: '';
  position: absolute;
  top: -40px; right: -40px;
  width: 160px; height: 160px;
  border-radius: 50%;
  border: 1px solid rgba(196,164,90,.12);
  pointer-events: none;
}
.fc-back::after {
  content: '';
  position: absolute;
  bottom: -30px; left: -30px;
  width: 100px; height: 100px;
  border-radius: 50%;
  border: 1px solid rgba(196,164,90,.08);
  pointer-events: none;
}

/* Ícone da seção no card */
.fc-sec-icon {
  width: 44px; height: 44px;
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 1rem;
  flex-shrink: 0;
}

/* Label de face */
.fc-face-label {
  font-family: 'Raleway', sans-serif;
  font-size: 8px;
  font-weight: 700;
  letter-spacing: .3em;
  text-transform: uppercase;
  color: #ccc;
  margin-bottom: .6rem;
  position: relative;
  z-index: 1;
}
.fc-back .fc-face-label { color: rgba(255,255,255,.3); }

/* Termo principal */
.fc-term {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(1.4rem, 3vw, 2.2rem);
  font-weight: 400;
  color: #1a1a2e;
  line-height: 1.15;
  position: relative;
  z-index: 1;
}
.fc-back .fc-term {
  color: var(--gold-light);
}

/* Exemplo */
.fc-exemplo {
  font-family: 'Raleway', sans-serif;
  font-size: .68rem;
  color: rgba(255,255,255,.45);
  font-style: italic;
  line-height: 1.65;
  margin-top: .9rem;
  border-top: 1px solid rgba(255,255,255,.1);
  padding-top: .8rem;
  position: relative;
  z-index: 1;
  max-width: 500px;
}

/* Dica de clique */
.fc-hint {
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: 'Raleway', sans-serif;
  font-size: .6rem;
  color: #ccc;
  margin-top: .7rem;
  position: relative;
  z-index: 1;
  animation: hintPulse 2.5s ease-in-out infinite;
}
@keyframes hintPulse { 0%,100%{opacity:.4} 50%{opacity:.9} }
.fc-back .fc-hint { display: none; }

/* Controles */
.fc-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1.2rem;
}

/* Botão skip — laranja */
.fc-skip {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  cursor: pointer;
}
.fc-skip-btn {
  width: 52px; height: 52px;
  border-radius: 50%;
  border: 2px solid #ffe0b2;
  background: #fff8f0;
  display: flex; align-items: center; justify-content: center;
  transition: all .2s;
  color: #e65100;
}
.fc-skip-btn:hover { background: #fff3e0; border-color: #ffb74d; transform: scale(1.08); }
.fc-skip-lbl {
  font-family: 'Raleway', sans-serif;
  font-size: .55rem;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: #e65100;
  opacity: .7;
}

/* Botão virar */
.fc-flip-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  cursor: pointer;
}
.fc-flip-circle {
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 1.5px solid #e8e4e0;
  background: #fff;
  display: flex; align-items: center; justify-content: center;
  color: #aaa;
  transition: all .2s;
}
.fc-flip-circle:hover { border-color: var(--gold); color: var(--gold); transform: rotate(15deg); }
.fc-flip-lbl {
  font-family: 'Raleway', sans-serif;
  font-size: .55rem;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: #bbb;
}

/* Botão sabia — verde */
.fc-knew {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  cursor: pointer;
}
.fc-knew-btn {
  width: 52px; height: 52px;
  border-radius: 50%;
  border: 2px solid #c8e6c9;
  background: #f1f8e9;
  display: flex; align-items: center; justify-content: center;
  transition: all .2s;
  color: #2e7d32;
}
.fc-knew-btn:hover { background: #e8f5e9; border-color: #81c784; transform: scale(1.08); }
.fc-knew-lbl {
  font-family: 'Raleway', sans-serif;
  font-size: .55rem;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: #2e7d32;
  opacity: .7;
}

/* Embaralhar */
.fc-shuffle {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: 'Raleway', sans-serif;
  font-size: .6rem;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: #bbb;
  border: 1.5px solid #e8e4e0;
  background: #fff;
  border-radius: 20px;
  padding: .4rem 1rem;
  cursor: pointer;
  transition: all .2s;
  margin-top: 1rem;
}
.fc-shuffle:hover { border-color: var(--gold); color: var(--gold); }

/* Tela de fim */
.fc-done-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 3rem 1rem;
}
.fc-done-icon {
  width: 72px; height: 72px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 1.4rem;
}
.fc-done-icon.great { background: linear-gradient(135deg,#e8f5e9,#c8e6c9); color: #2e7d32; }
.fc-done-icon.keep  { background: linear-gradient(135deg,#fff3e0,#ffe0b2); color: #e65100; }
.fc-done-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 2rem;
  font-weight: 300;
  color: #1a1a2e;
  margin-bottom: .4rem;
}
.fc-done-sub {
  font-family: 'Raleway', sans-serif;
  font-size: .72rem;
  color: #aaa;
  line-height: 1.7;
  margin-bottom: 1.8rem;
  max-width: 300px;
}
.fc-done-stats {
  display: flex;
  gap: 2rem;
  margin-bottom: 2rem;
}
.fc-ds {
  text-align: center;
}
.fc-ds-num {
  font-family: 'Cormorant Garamond', serif;
  font-size: 2.2rem;
  font-weight: 300;
  line-height: 1;
}
.fc-ds-lbl {
  font-family: 'Raleway', sans-serif;
  font-size: .6rem;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: #bbb;
  margin-top: .3rem;
}
.fc-restart-btn {
  display: flex;
  align-items: center;
  gap: 7px;
  background: #1a1a2e;
  color: #fff;
  border: none;
  border-radius: 20px;
  padding: .7rem 1.6rem;
  font-family: 'Raleway', sans-serif;
  font-size: .65rem;
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background .2s;
}
.fc-restart-btn:hover { background: #163158; }

/* Empty */
.fc-empty {
  text-align: center;
  padding: 4rem 2rem;
}
.fc-empty-icon {
  width: 64px; height: 64px;
  border-radius: 50%;
  background: #ece8e2;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 1.2rem;
  color: #ccc;
}
.fc-empty h3 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.4rem;
  font-weight: 300;
  color: #555;
  margin-bottom: .4rem;
}
.fc-empty p {
  font-family: 'Raleway', sans-serif;
  font-size: .72rem;
  color: #aaa;
  line-height: 1.7;
}

/* Cores dos cards por seção */
.fc-front.sec-vocabulario { border-top: 3px solid #C4A45A; }
.fc-front.sec-frases       { border-top: 3px solid #00BCD4; }
.fc-front.sec-termos       { border-top: 3px solid #7c6ea0; }
.fc-front.sec-anotacoes    { border-top: 3px solid #4CAF50; }
.fc-sec-icon.sec-vocabulario { background: linear-gradient(135deg,#FFF3DC,#F0C860); color: #9A7B2E; }
.fc-sec-icon.sec-frases      { background: linear-gradient(135deg,#E0F7FA,#00ACC1); color: #006064; }
.fc-sec-icon.sec-termos      { background: linear-gradient(135deg,#EDE7F6,#9C27B0); color: #4A148C; }
.fc-sec-icon.sec-anotacoes   { background: linear-gradient(135deg,#F1F8E9,#8BC34A); color: #33691E; }

@media(max-width:700px){.pl-grid{grid-template-columns:repeat(2,1fr);}#caderno-nav .nav-brand{display:none;}#search-input{width:120px;}}
</style>
</head>
<body>

<!-- HERO -->
<section id="hero">
  <div id="loading-state"><div style="display:flex;flex-direction:column;align-items:center;gap:14px;"><span class="loading-logo">MD Talk</span><div style="width:40px;height:1px;background:var(--gold);opacity:.3;"></div></div></div>
  <div id="hero-bg"></div><div id="hero-overlay"></div><div id="hero-dots"></div>
  <div class="geo geo-ring"></div><div class="geo geo-ring-2"></div><div class="geo geo-diamond"></div><div class="geo geo-line"></div>
  <div id="hero-content">
    <span class="overline" id="g-overline">Boa noite,</span>
    <h1 class="hero-name" id="s-name">Thaiana</h1>
    <div class="hero-divider"></div>
    <div class="hero-info"><span id="i-city">Sao Paulo</span><span class="sep"></span><span id="i-temp">--</span><span class="sep"></span><span id="i-cond">Carregando</span></div>
    <div id="clock">00:00:00</div>
    <div class="clima-label"><span class="clima-dot"></span><span>Clima ao vivo</span></div>
  </div>

  <!-- TRADUTOR NO HERO -->
  <div id="hero-translator">
    <div class="ht-wrap">
      <div class="ht-dir" id="ht-dir" onclick="htToggleDir()">
        <span class="ht-dir-from" id="ht-from">PT</span>
        <span class="ht-dir-arrow">⇄</span>
        <span class="ht-dir-to" id="ht-to">EN</span>
      </div>
      <div class="ht-sep"></div>
      <input type="text" id="ht-input" placeholder="Traduzir um termo médico...">
      <button class="ht-btn" id="ht-btn" onclick="htTranslate()">
        <span class="ht-btn-ring"></span>
        Traduzir
      </button>
    </div>
    <div id="ht-result">
      <button class="ht-close" onclick="htClose()">✕</button>
      <div id="ht-out"></div>
    </div>
  </div>

  <!-- MUSIC PLAYER -->
  <div id="music-player">
    <div id="music-btn" onclick="musicToggle()" title="Música ambiente">
      <!-- Ícone mudo (padrão) -->
      <svg id="icon-muted" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>
      </svg>
      <!-- Barras de equalizer (playing) -->
      <div class="eq-bars" id="icon-playing" style="display:none">
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
      </div>
    </div>
    <span id="music-label">Sem som</span>
  </div>

  <!-- YouTube embed oculto -->
  <iframe id="yt-frame"
    src="https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=0&loop=1&playlist=jfKfPfyJRdk&controls=0&mute=1"
    allow="autoplay"
    frameborder="0">
  </iframe>
  <div class="scroll-indicator"><span>Explorar</span><div class="scroll-line"></div></div>
</section>

<!-- ABAS ESTILO CHROME -->
<div id="chrome-tabbar">

  <div class="ctab active" id="ctab-dash" onclick="switchTab('dash')">
    <span class="ctab-fav">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
    </span>
    <span class="ctab-title">Dashboard</span>
    <span class="ctab-x" onclick="event.stopPropagation();closeTab('dash')">✕</span>
  </div>

  <div class="ctab" id="ctab-caderno" onclick="switchTab('caderno')">
    <span class="ctab-fav">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
      </svg>
    </span>
    <span class="ctab-title">Meu Caderno</span>
    <span class="ctab-x" onclick="event.stopPropagation();closeTab('caderno')">✕</span>
  </div>

  <div class="ctab" id="ctab-planner" onclick="switchTab('planner')">
    <span class="ctab-fav">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
    </span>
    <span class="ctab-title">Planner Semanal</span>
    <span class="ctab-x" onclick="event.stopPropagation();closeTab('planner')">✕</span>
  </div>

  <div class="ctab" id="ctab-flash" onclick="switchTab('flash')">
    <span class="ctab-fav">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="14" rx="2"/>
        <line x1="8" y1="21" x2="16" y2="21"/>
        <line x1="12" y1="17" x2="12" y2="21"/>
      </svg>
    </span>
    <span class="ctab-title">Flashcards</span>
    <span class="ctab-x" onclick="event.stopPropagation();closeTab('flash')">✕</span>
  </div>

</div>

<!-- PAINÉIS -->
<div id="tab-panels">
  <div class="tab-panel active" id="panel-dash">
    <div id="dash-body" style="max-width:1100px;margin:0 auto;padding:2.5rem 2rem 4rem;"></div>
  </div>

  <div class="tab-panel" id="panel-caderno">
    <!-- Nav do caderno e corpo ficam aqui -->
    <div id="caderno-nav-wrap"></div>
    <div id="caderno-body-wrap"></div>
  </div>

  <div class="tab-panel" id="panel-planner">
    <div style="max-width:1100px;margin:0 auto;padding:2rem 2rem 3rem;">
      <div id="planner-body"></div>
    </div>
  </div>
  <div class="tab-panel" id="panel-flash">
    <div style="max-width:900px;margin:0 auto;padding:2rem 2rem 3rem;">
      <div id="flash-body"></div>
    </div>

</div>

<!-- CADERNO NAV -->
<nav id="caderno-nav">
  <div class="nav-inner">
    <div class="nav-tabs" id="tabs-wrap">
      <button class="ntab active" data-tab="todos" onclick="setTab('todos',this)">Todos</button>
      <button class="ntab" data-tab="vocabulario" onclick="setTab('vocabulario',this)">Vocabulario</button>
      <button class="ntab" data-tab="frases" onclick="setTab('frases',this)">Frases</button>
      <button class="ntab" data-tab="termos" onclick="setTab('termos',this)">Termos</button>
      <button class="ntab" data-tab="anotacoes" onclick="setTab('anotacoes',this)">Anotacoes</button>
      <button class="ntab ntab-nova" onclick="novaSecao()">+ Secao</button>
    </div>
    <div class="nav-actions">
      <div class="nav-sw"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input type="text" id="search-input" placeholder="Buscar..."></div>
      <button class="btn-dl" onclick="dlCaderno()" title="Download"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>
      <button class="btn-novo" onclick="abrirModal()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Nova entrada</button>
    </div>
  </div>
</nav>

<section id="caderno">
  <div id="caderno-body">
    <div class="ec" id="ec"></div>
    <div class="cards-grid" id="cards-grid"></div>
  </div>
</section>

<!-- MODAL -->
<div class="modal-bd" id="modal" onclick="if(event.target===this)fecharModal()">
  <div class="modal">
    <div class="modal-top"><h3 class="modal-ttl" id="modal-ttl">Nova entrada</h3><button class="modal-x" onclick="fecharModal()">x</button></div>
    <div class="modal-body">
      <div class="frow">
        <div class="fg"><label class="flbl">Secao</label><select class="fsel" id="f-sec"><option value="vocabulario">Vocabulario</option><option value="frases">Frases</option><option value="termos">Termos Clinicos</option><option value="anotacoes">Anotacoes</option></select></div>
        <div class="fg"><label class="flbl">Idioma</label><select class="fsel" id="f-idi"><option value="en">English</option><option value="pt">Portugues</option></select></div>
      </div>
      <div class="fg"><label class="flbl">Termo / Frase *</label><input type="text" class="finp" id="f-termo" placeholder="Ex: dyspnea on exertion"><p class="fhint">Escreva o termo exatamente como quer memorizar.</p></div>
      <div class="fg"><label class="flbl">Traducao (opcional)</label><input type="text" class="finp" id="f-trad" placeholder="Ex: dispneia aos esforcos"></div>
      <div class="fg"><label class="flbl">Exemplo (opcional)</label><textarea class="ftxt" id="f-ex" placeholder="Ex: The patient reports dyspnea on exertion since last week."></textarea></div>
      <button class="btn-save" onclick="salvarEntrada()">Salvar entrada</button>
    </div>
  </div>

function drawRadar(data) {
  const canvas = document.getElementById('radar-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2 + 5;
  const R  = Math.min(W,H) * .36;
  const n  = data.length;
  ctx.clearRect(0, 0, W, H);
  const angle = i => (Math.PI*2*i/n) - Math.PI/2;
  const pt    = (i,r) => ({ x: cx + r*Math.cos(angle(i)), y: cy + r*Math.sin(angle(i)) });

  // Grades
  [.25,.5,.75,1].forEach((pct,gi) => {
    ctx.beginPath();
    for (let i=0;i<n;i++) { const p=pt(i,R*pct); i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y); }
    ctx.closePath();
    ctx.strokeStyle = gi===3 ? 'rgba(0,0,0,.12)' : 'rgba(0,0,0,.06)';
    ctx.lineWidth = 1; ctx.stroke();
    // Label % na última grade
    if (gi===1) {
      ctx.font='500 8px Raleway,sans-serif';
      ctx.fillStyle='#ccc'; ctx.textAlign='center';
      ctx.fillText('50%', cx+2, cy - R*.5 - 5);
    }
  });

  // Eixos
  for (let i=0;i<n;i++) {
    const p=pt(i,R);
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(p.x,p.y);
    ctx.strokeStyle='rgba(0,0,0,.08)'; ctx.lineWidth=1; ctx.stroke();
  }

  // Área — animação
  ctx.beginPath();
  data.forEach((d,i) => { const p=pt(i,R*(d.val/100)); i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y); });
  ctx.closePath();
  const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,R);
  grad.addColorStop(0,'rgba(196,164,90,.35)');
  grad.addColorStop(1,'rgba(196,164,90,.08)');
  ctx.fillStyle=grad; ctx.fill();
  ctx.strokeStyle='#C4A45A'; ctx.lineWidth=2; ctx.stroke();

  // Pontos com glow
  data.forEach((d,i) => {
    const p=pt(i,R*(d.val/100));
    ctx.beginPath(); ctx.arc(p.x,p.y,5,0,Math.PI*2);
    ctx.fillStyle='#C4A45A'; ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
    // Glow
    ctx.beginPath(); ctx.arc(p.x,p.y,8,0,Math.PI*2);
    ctx.fillStyle='rgba(196,164,90,.15)'; ctx.fill();
  });

  // Labels
  data.forEach((d,i) => {
    const p=pt(i,R*1.25);
    ctx.font='600 9px Raleway,sans-serif';
    ctx.fillStyle= d.val > 50 ? '#555' : '#aaa';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(d.label, p.x, p.y);
  });

  // Valor central
  const avg = Math.round(data.reduce((s,d)=>s+d.val,0)/data.length);
  ctx.font='300 22px Cormorant Garamond,serif'; ctx.fillStyle='#1a1a2e'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(avg+'%', cx, cy);
  ctx.font='600 8px Raleway,sans-serif'; ctx.fillStyle='#bbb'; ctx.textBaseline='top';
  ctx.fillText('SCORE', cx, cy+14);
}

            <div class="fc-ds-lbl">Acerto</div>
          </div>
        </div>
        <button class="fc-restart-btn" onclick="fRestart()">
          ${SVG_SHUFFLE} Repetir baralho
        </button>
      </div>`;
  } else {
    // Card atual
    const entry = fDeck[fIdx];
    const sec   = entry.secao;
    const mode  = fMode === 'aleatorio' ? (entry._m || (entry._m = Math.random()>.5?'termo':'traducao')) : fMode;
    const front = mode === 'termo' ? entry.termo    : entry.traducao;
    const back  = mode === 'termo' ? entry.traducao : entry.termo;
    const frontL = mode === 'termo' ? 'Termo' : 'Tradução';
    const backL  = mode === 'termo' ? 'Tradução' : 'Termo';

    mainHTML = `
      <!-- Card 3D -->
      <div class="fc-scene ${fFlip?'flipped':''}" id="fc-card" onclick="doFlip()">
        <div class="fc-inner">

          <!-- Frente -->
          <div class="fc-face fc-front sec-${sec}">
            <div class="fc-sec-icon sec-${sec}">
              ${FC_SEC_SVGS[sec]||''}
            </div>
            <div class="fc-face-label">${frontL}</div>
            <div class="fc-term">${front}</div>
            <div class="fc-hint">
              ${SVG_FLIP}
              Clique para revelar
            </div>
          </div>

          <!-- Verso -->
          <div class="fc-face fc-back">
            <div class="fc-face-label">${backL}</div>
            <div class="fc-term">${back}</div>
            ${entry.exemplo ? '<div class="fc-exemplo">'+entry.exemplo+'</div>' : ''}
          </div>

        </div>
      </div>

      <!-- Controles -->
      <div class="fc-controls">
        <div class="fc-skip" onclick="fNext(false)">
          <div class="fc-skip-btn">${SVG_SKIP}</div>
          <span class="fc-skip-lbl">Revisar</span>
        </div>

        <div class="fc-flip-btn" onclick="doFlip()">
          <div class="fc-flip-circle">${SVG_FLIP}</div>
          <span class="fc-flip-lbl">Virar</span>
        </div>

        <div class="fc-knew" onclick="fNext(true)">
          <div class="fc-knew-btn">${SVG_KNEW}</div>
          <span class="fc-knew-lbl">Sabia!</span>
        </div>
      </div>

      <button class="fc-shuffle" onclick="fShuf()">${SVG_SHUFFLE} Embaralhar</button>
    `;
  }

  body.innerHTML = `
    <div class="flash-wrap">

      <!-- Header -->
      <div class="flash-hdr">
        <div class="flash-hdr-left">
          <div class="flash-hdr-title">Meus <em>Flashcards</em></div>
          <div class="flash-hdr-sub">${fDeck.length} cards disponíveis · ${entradas.filter(e=>e.traducao&&e.traducao.trim()).length} com tradução</div>
        </div>
        <div class="flash-modes">${modeBtns}</div>
      </div>

      <!-- Filtros -->
      <div class="flash-filters" style="margin-bottom:1.8rem">
        <span class="ff-label">Seções</span>
        ${secFilters}
      </div>

      <!-- Progresso -->
      ${fIdx < fDeck.length ? `
      <div class="flash-progress">
        <div class="fp-row">
          <span class="fp-count">${fIdx + 1} <span style="color:#ccc;font-size:.8rem">/ ${fDeck.length}</span></span>
          <span class="fp-pct">${pct}% concluído</span>
        </div>
        <div class="fp-bar"><div class="fp-fill" style="width:${pct}%"></div></div>
        ${scoreHTML}
      </div>` : ''}

      ${mainHTML}
    </div>`;
}

function fTogSec(s) {
  const i = fSecs.indexOf(s);
  if (i===-1) fSecs.push(s);
  else if (fSecs.length > 1) fSecs.splice(i,1);
  buildDeck();
  renderFlash();
}
function fSetMode(m) { fMode=m; fDeck.forEach(e=>delete e._m); renderFlash(); }
function doFlip() {
  fFlip = !fFlip;
  const card = document.getElementById('fc-card');
  if (card) card.classList.toggle('flipped');
}
function fNext(knew) {
  if (knew) fKnew++; else fSkip++;
  fFlip = false;
  fIdx++;
  renderFlash();
}
function fShuf() {
  fDeck.sort(() => Math.random()-.5);
  fIdx=0; fKnew=0; fSkip=0; fFlip=false;
  renderFlash();
}
function fRestart() { buildDeck(); renderFlash(); }

// TOUR
const TOUR=[
  {i:"<svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 11V6a2 2 0 0 0-2-2 2 2 0 0 0-2 2\"/><path d=\"M14 10V4a2 2 0 0 0-2-2 2 2 0 0 0-2 2v2\"/><path d=\"M10 10.5V6a2 2 0 0 0-2-2 2 2 0 0 0-2 2v8\"/><path d=\"M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15\"/></svg>",t:'Bem-vindo ao seu Caderno',d:'Seu espaco pessoal de aprendizado. Registre vocabulario, frases e termos clinicos das suas aulas.'},
  {i:"<svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 20h9\"/><path d=\"M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z\"/></svg>",t:'Nova entrada',d:'Clique em "Nova entrada" para adicionar um termo, frase ou anotacao. Traducao e exemplo sao opcionais.'},
  {i:"<svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z\"/></svg>",t:'Secoes',d:'Navegue pelas secoes na barra de cima. Voce pode criar novas secoes personalizadas.'},
  {i:"<svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\"/><line x1=\"16\" y1=\"2\" x2=\"16\" y2=\"6\"/><line x1=\"8\" y1=\"2\" x2=\"8\" y2=\"6\"/><line x1=\"3\" y1=\"10\" x2=\"21\" y2=\"10\"/></svg>",t:'Planner e Flashcards',d:'Use as abas na lateral direita para abrir o Planner Semanal ou seus Flashcards. Voce pode arrastar as janelas para qualquer posicao.'},
  {i:"<svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\"/><polyline points=\"7 10 12 15 17 10\"/><line x1=\"12\" y1=\"15\" x2=\"12\" y2=\"3\"/></svg>",t:'Download',d:'Clique no icone de download para exportar todo o conteudo do caderno.'},
];
let tIdx=0;
function initTour(){if(localStorage.getItem('mdtalk_tour_ok'))return;setTimeout(()=>{renderTourStep();document.getElementById('tour-ov').classList.add('on');},1200);}
function renderTourStep(){const s=TOUR[tIdx],n=TOUR.length;document.getElementById('t-ico').innerHTML=s.i;document.getElementById('t-step').textContent='Passo '+(tIdx+1)+' de '+n;document.getElementById('t-ttl').textContent=s.t;document.getElementById('t-desc').textContent=s.d;document.getElementById('t-dots').innerHTML=TOUR.map((_,i)=>'<div class="t-dot '+(i===tIdx?'on':'')+'"></div>').join('');document.querySelector('.t-next').textContent=tIdx===n-1?'Comecar':'Proximo';}
function tourNext(){tIdx++;if(tIdx>=TOUR.length)fecharTour();else renderTourStep();}
function fecharTour(){document.getElementById('tour-ov').classList.remove('on');localStorage.setItem('mdtalk_tour_ok','1');}

document.addEventListener('keydown',e=>{if(e.key==='Escape'){fecharModal();fecharTour();cpClose();}});

// INIT
renderCards();
initTour();
initWC();
</script>
</body>
</html>
