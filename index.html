<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caderno do Aluno — MD Talk</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:       #0B1D3A;
    --navy-deep:  #050D1A;
    --navy-mid:   #0F2645;
    --navy-light: #163158;
    --gold:       #C4A45A;
    --gold-light: #D4BA7A;
    --gold-pale:  #E8D9B0;
    --cream:      rgba(255,255,255,.88);
    --muted:      rgba(255,255,255,.42);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Raleway', sans-serif;
    background: var(--navy-deep);
    color: var(--cream);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HERO ── */
  #hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  #hero-bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center top;
    background-repeat: no-repeat;
    transition: opacity 1.4s ease;
    opacity: 0;
  }
  #hero-bg.loaded { opacity: 1; }

  #hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(5,13,26,0.52) 0%,
      rgba(5,13,26,0.28) 45%,
      rgba(5,13,26,0.70) 100%
    );
  }

  #hero-dots {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(196,164,90,.10) 1px, transparent 1px);
    background-size: 28px 28px;
    pointer-events: none;
  }

  /* Geo elements */
  .geo { position: absolute; pointer-events: none; }
  .geo-ring {
    width: 340px; height: 340px;
    border: 1px solid rgba(196,164,90,.13);
    border-radius: 50%;
    top: -80px; right: -90px;
    animation: geoFloat 11s ease-in-out infinite;
  }
  .geo-ring-2 {
    width: 200px; height: 200px;
    border: 1px solid rgba(196,164,90,.09);
    border-radius: 50%;
    bottom: 100px; left: -50px;
    animation: geoFloat 14s ease-in-out infinite;
    animation-delay: -5s;
  }
  .geo-diamond {
    width: 56px; height: 56px;
    border: 1px solid rgba(196,164,90,.22);
    bottom: 180px; right: 140px;
    animation: geoFloatDiamond 8s ease-in-out infinite;
    animation-delay: -3s;
  }
  .geo-line {
    width: 1px; height: 110px;
    background: linear-gradient(to bottom, transparent, rgba(196,164,90,.28), transparent);
    top: 32%; left: 72px;
    animation: geoFloat 10s ease-in-out infinite;
    animation-delay: -7s;
  }

  @keyframes geoFloat {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-16px); }
  }
  @keyframes geoFloatDiamond {
    0%, 100% { transform: rotate(45deg) translateY(0); }
    50%       { transform: rotate(45deg) translateY(-12px); }
  }

  /* Hero content */
  #hero-content {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 2rem 1.5rem;
    max-width: 720px;
    opacity: 0;
    transform: translateY(28px);
    transition: opacity 1s ease 0.5s, transform 1s ease 0.5s;
  }
  #hero-content.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .hero-overline {
    font-family: 'Raleway', sans-serif;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 1.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }
  .hero-overline::before,
  .hero-overline::after {
    content: '';
    width: 36px; height: 1px;
    background: var(--gold);
    opacity: 0.45;
  }

  .hero-greeting {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.6rem, 5.5vw, 4rem);
    font-weight: 300;
    line-height: 1.12;
    color: var(--cream);
    margin-bottom: 0.4rem;
  }
  .hero-greeting em {
    font-style: italic;
    color: var(--gold-light);
  }

  .hero-city {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.1rem, 2.5vw, 1.6rem);
    font-weight: 300;
    color: var(--gold-pale);
    letter-spacing: 0.1em;
    margin-bottom: 0.2rem;
    opacity: 0.85;
  }

  .hero-divider {
    width: 56px; height: 1px;
    background: linear-gradient(to right, transparent, var(--gold), transparent);
    margin: 1.1rem auto;
  }

  .hero-desc {
    font-family: 'Raleway', sans-serif;
    font-size: 0.78rem;
    font-weight: 400;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 2rem;
  }

  /* Weather badge */
  #weather-badge {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    background: rgba(11,29,58,0.55);
    border: 1px solid rgba(196,164,90,.22);
    border-radius: 40px;
    padding: 0.42rem 1.2rem;
    font-size: 0.73rem;
    font-family: 'Raleway', sans-serif;
    font-weight: 500;
    letter-spacing: 0.09em;
    color: var(--gold-pale);
    margin-bottom: 2.2rem;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    opacity: 0;
    transition: opacity 0.8s ease 0.2s;
  }
  #weather-badge.visible { opacity: 1; }

  /* CTA */
  .hero-cta {
    display: inline-block;
    font-family: 'Raleway', sans-serif;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--navy-deep);
    background: var(--gold);
    border: none;
    padding: 0.9rem 2.6rem;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.3s ease, transform 0.2s ease;
  }
  .hero-cta:hover {
    background: var(--gold-light);
    transform: translateY(-2px);
  }

  /* Scroll indicator */
  .scroll-indicator {
    position: absolute;
    bottom: 2.2rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    animation: scrollPulse 2.8s ease-in-out infinite;
  }
  .scroll-indicator span {
    font-size: 0.58rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gold);
    font-family: 'Raleway', sans-serif;
  }
  .scroll-line {
    width: 1px; height: 38px;
    background: linear-gradient(to bottom, var(--gold), transparent);
  }
  @keyframes scrollPulse {
    0%, 100% { opacity: 0.28; transform: translateX(-50%) translateY(0); }
    50%       { opacity: 0.65; transform: translateX(-50%) translateY(7px); }
  }

  /* Loading */
  #loading-state {
    position: absolute;
    inset: 0;
    background: var(--navy-deep);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
    transition: opacity 0.9s ease;
  }
  #loading-state.hidden { opacity: 0; pointer-events: none; }

  .loading-mark {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .loading-logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.3rem;
    font-weight: 300;
    letter-spacing: 0.35em;
    color: var(--gold);
    text-transform: uppercase;
    animation: fadeInOut 1.9s ease-in-out infinite;
  }
  .loading-line {
    width: 40px; height: 1px;
    background: var(--gold);
    opacity: 0.3;
    animation: fadeInOut 1.9s ease-in-out infinite reverse;
  }
  @keyframes fadeInOut {
    0%, 100% { opacity: 0.15; }
    50%       { opacity: 0.75; }
  }
</style>
</head>
<body>

<section id="hero">

  <div id="loading-state">
    <div class="loading-mark">
      <span class="loading-logo">MD Talk</span>
      <div class="loading-line"></div>
    </div>
  </div>

  <div id="hero-bg"></div>
  <div id="hero-overlay"></div>
  <div id="hero-dots"></div>

  <div class="geo geo-ring"></div>
  <div class="geo geo-ring-2"></div>
  <div class="geo geo-diamond"></div>
  <div class="geo geo-line"></div>

  <div id="hero-content">
    <div class="hero-overline">Instituto MD Talk · Caderno do Aluno</div>
    <h1 class="hero-greeting" id="greeting-text">Boa tarde, <em>Silva</em></h1>
    <p class="hero-city" id="student-city">São Paulo</p>
    <div class="hero-divider"></div>
    <p class="hero-desc">O seu espaço de aprendizado personalizado</p>

    <div id="weather-badge">
      <span id="weather-icon">☀️</span>
      <span id="weather-text">Carregando clima...</span>
    </div>

    <br>
    <a href="#caderno" class="hero-cta">Abrir meu caderno</a>
  </div>

  <div class="scroll-indicator">
    <span>Explorar</span>
    <div class="scroll-line"></div>
  </div>

</section>

<script>
// ── MAPEAMENTO DE IMAGENS ──────────────────────────────────
// Imagens hospedadas no Google Drive (pasta pública)
const IMAGES = {
  "amanhecer-limpo": "1Rk7SnutIEJnS48SbQsh_IkjAzGy3IpYm",  // c.png — dourado intenso
  "amanhecer-chuva": "1ZuEQ4zA-f_f7iApj4YrujNUA9mLLDnGU",  // i.png — violeta/chuva
  "dia-ensolarado":  "17UO6iLqIaiA5vnYEs7jqkDR3d1jiL35E",  // b.png — céu azul limpo
  "dia-nublado":     "1NGL3xbDMu4DxcT1Kca20280VfflbjjeX",  // e.png — cinza névoa
  "dia-chuva":       "1OXhei11KCLjOLBv1nGzQpw6Sw36X3FTQ",  // g.png — chuva P&B
  "por-do-sol":      "1PDwEYdjlZ2eqa1lZcGSReQryNrLqjLqo",  // a.png — laranja/rosa
  "noite-limpa":     "1SSXCMyE7xw611qr7IukKmFuW8RsdbTkT",  // d.png — estrelado
  "noite-chuva":     "1AFVaFEdP8AFqQHtExCZUCmlJMCxDWHVo"   // f.png — azul escuro/nuvens
};

function driveUrl(id) {
  return `https://drive.google.com/thumbnail?id=${id}&sz=w1920`;
}

// ── LÓGICA DE SELEÇÃO DE IMAGEM ───────────────────────────
function selectImage(weatherCode, hour) {
  const rainy  = weatherCode >= 51;
  const cloudy = weatherCode >= 1 && weatherCode < 51;

  if (hour >= 5 && hour < 8) {
    return rainy ? "amanhecer-chuva" : "amanhecer-limpo";
  }
  if (hour >= 8 && hour < 17) {
    if (rainy)   return "dia-chuva";
    if (cloudy)  return "dia-nublado";
    return "dia-ensolarado";
  }
  if (hour >= 17 && hour < 20) {
    return "por-do-sol";
  }
  // noite: 20h–5h
  return rainy ? "noite-chuva" : "noite-limpa";
}

// ── SAUDAÇÃO ──────────────────────────────────────────────
function greeting(hour, name) {
  if (hour >= 5  && hour < 12) return `Bom dia, <em>${name}</em>`;
  if (hour >= 12 && hour < 18) return `Boa tarde, <em>${name}</em>`;
  return `Boa noite, <em>${name}</em>`;
}

// ── ÍCONE E DESCRIÇÃO DO CLIMA ────────────────────────────
function weatherIcon(code, hour) {
  const night = hour < 5 || hour >= 20;
  if (code === 0)  return night ? "🌙" : "☀️";
  if (code < 51)   return "⛅";
  return "🌧️";
}

function weatherDesc(code) {
  if (code === 0)  return "Céu limpo";
  if (code <= 3)   return "Parcialmente nublado";
  if (code <= 48)  return "Nublado";
  if (code <= 67)  return "Com chuva";
  return "Tempestade";
}

// ── BUSCA DE CLIMA VIA CLAUDE BACKEND ─────────────────────
async function fetchWeatherCode(city) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 1000,
      system: `You are a geocoding assistant. Return ONLY a valid JSON object with no extra text or markdown.
Format: {"lat": number, "lon": number}
Return the coordinates for the given Brazilian city.`,
      messages: [{ role: "user", content: city }]
    })
  });
  const data = await res.json();
  const text = data.content.filter(b => b.type === "text").map(b => b.text).join("");
  const { lat, lon } = JSON.parse(text.replace(/```json|```/g, "").trim());

  const weather = await fetch(
    `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`
  );
  const wdata = await weather.json();
  return wdata.current_weather.weathercode;
}

// ── INICIALIZAÇÃO ─────────────────────────────────────────
async function init() {
  // Dados do aluno vindos do portal via sessionStorage
  const name = sessionStorage.getItem("mdtalk_student_name") || "Silva";
  const city = sessionStorage.getItem("mdtalk_student_city") || "São Paulo";

  const hour = new Date().getHours();

  // Saudação e cidade
  document.getElementById("greeting-text").innerHTML = greeting(hour, name);
  document.getElementById("student-city").textContent = city;

  // Busca clima
  let code = 0;
  try { code = await fetchWeatherCode(city); } catch(e) { code = 0; }

  // Seleciona imagem
  const key = selectImage(code, hour);
  const id  = IMAGES[key];

  // Badge de clima
  document.getElementById("weather-icon").textContent = weatherIcon(code, hour);
  document.getElementById("weather-text").textContent = `${city} · ${weatherDesc(code)}`;
  document.getElementById("weather-badge").classList.add("visible");

  // Carrega imagem de fundo
  const bg = document.getElementById("hero-bg");
  const img = new Image();
  img.onload = () => {
    bg.style.backgroundImage = `url('${driveUrl(id)}')`;
    bg.classList.add("loaded");
  };
  img.onerror = () => {
    bg.style.background = `radial-gradient(ellipse at 55% 35%, var(--navy-light) 0%, var(--navy-deep) 70%)`;
    bg.classList.add("loaded");
  };
  img.src = driveUrl(id);

  // Revela conteúdo
  setTimeout(() => {
    document.getElementById("loading-state").classList.add("hidden");
    document.getElementById("hero-content").classList.add("visible");
  }, 700);
}

init();
</script>
</body>
</html>
