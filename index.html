<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caderno do Aluno — MD Talk</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy-deep: #050D1A;
    --gold:      #C4A45A;
    --gold-light:#D4BA7A;
    --cream:     rgba(255,255,255,.88);
    --muted:     rgba(255,255,255,.42);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Raleway', sans-serif;
    background: var(--navy-deep);
    color: var(--cream);
    min-height: 100vh;
    overflow: hidden;
  }

  /* ── HERO ── */
  #hero {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Imagem de fundo */
  #hero-bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    opacity: 0;
    transition: opacity 1.6s ease;
  }
  #hero-bg.loaded { opacity: 1; }

  /* Overlay */
  #hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(5,13,26,0.80) 0%,
      rgba(5,13,26,0.68) 40%,
      rgba(5,13,26,0.88) 100%
    );
  }

  /* Dot grid */
  #hero-dots {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(196,164,90,.07) 1px, transparent 1px);
    background-size: 30px 30px;
    pointer-events: none;
  }

  /* ── CONTEÚDO ── */
  #hero-content {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 2rem;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 1.1s ease 0.6s, transform 1.1s ease 0.6s;
  }
  #hero-content.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* Overline — "BOA NOITE," */
  .overline {
    font-family: 'Raleway', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 0.6rem;
    display: block;
  }

  /* Nome grande */
  .hero-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(4.5rem, 12vw, 9rem);
    font-weight: 400;
    line-height: 0.95;
    color: var(--cream);
    letter-spacing: -0.01em;
    margin-bottom: 0;
  }

  /* Divider fino */
  .hero-divider {
    width: 40px;
    height: 1px;
    background: rgba(196,164,90,0.5);
    margin: 1.4rem auto 1.2rem;
  }

  /* Linha de info: cidade · temp · condição */
  .hero-info {
    font-family: 'Raleway', sans-serif;
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 0.9rem;
  }
  .hero-info .sep {
    width: 3px; height: 3px;
    background: var(--gold);
    border-radius: 50%;
    opacity: 0.6;
    flex-shrink: 0;
  }

  /* Relógio */
  #clock {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.1rem, 3vw, 1.6rem);
    font-weight: 300;
    letter-spacing: 0.18em;
    color: var(--cream);
    opacity: 0.75;
    margin-bottom: 1.4rem;
  }

  /* Clima ao vivo */
  .clima-label {
    font-family: 'Raleway', sans-serif;
    font-size: 0.62rem;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0.7;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
  }
  .clima-dot {
    width: 6px; height: 6px;
    background: var(--gold);
    border-radius: 50%;
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.3; transform: scale(0.8); }
    50%       { opacity: 1;   transform: scale(1.2); }
  }

  /* Loading */
  #loading-state {
    position: absolute;
    inset: 0;
    background: var(--navy-deep);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
    transition: opacity 1s ease;
  }
  #loading-state.hidden { opacity: 0; pointer-events: none; }
  .loading-logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.2rem;
    font-weight: 300;
    letter-spacing: 0.38em;
    color: var(--gold);
    text-transform: uppercase;
    animation: fadeInOut 2s ease-in-out infinite;
  }
  @keyframes fadeInOut {
    0%, 100% { opacity: 0.15; }
    50%       { opacity: 0.7; }
  }

  /* ── TRADUTOR FLUTUANTE ── */
  #translator {
    position: fixed;
    z-index: 100;
    width: 320px;
    background: rgba(5,13,26,0.82);
    border: 1px solid rgba(0,229,255,.35);
    border-radius: 20px;
    box-shadow:
      0 0 0 1px rgba(0,229,255,.08),
      0 12px 60px rgba(0,0,0,0.7),
      0 0 40px rgba(0,229,255,.12),
      0 0 80px rgba(0,229,255,.06),
      inset 0 1px 0 rgba(255,255,255,.04);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 1.2rem 1.4rem 1.4rem;
    animation: translatorFloat 9s ease-in-out infinite;
    cursor: grab;
    user-select: none;
    overflow: hidden;
  }
  /* linha de scan tech */
  #translator::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0,229,255,.8), transparent);
    animation: scanLine 3s ease-in-out infinite;
  }
  @keyframes scanLine {
    0%, 100% { opacity: 0.3; transform: scaleX(0.4); }
    50%       { opacity: 1;   transform: scaleX(1); }
  }
  /* corner marks */
  #translator::after {
    content: '';
    position: absolute;
    top: 10px; right: 10px;
    width: 8px; height: 8px;
    border-top: 1px solid rgba(0,229,255,.7);
    border-right: 1px solid rgba(0,229,255,.7);
    border-radius: 0 3px 0 0;
  }

  #translator:active { cursor: grabbing; }

  @keyframes translatorFloat {
    0%   { transform: translateY(0px)   translateX(0px); }
    25%  { transform: translateY(-10px) translateX(6px); }
    50%  { transform: translateY(-4px)  translateX(12px); }
    75%  { transform: translateY(-14px) translateX(4px); }
    100% { transform: translateY(0px)   translateX(0px); }
  }
  #translator.dragging { animation: none; }

  .trans-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
  }
  .trans-title-wrap {
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .trans-icon {
    width: 20px; height: 20px;
    border-radius: 6px;
    background: rgba(0,229,255,.08);
    border: 1px solid rgba(0,229,255,.3);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px;
  }
  .trans-title {
    font-family: 'Raleway', sans-serif;
    font-size: 8.5px;
    font-weight: 700;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .trans-direction {
    display: flex;
    align-items: center;
    gap: 5px;
    background: rgba(0,229,255,.04);
    border: 1px solid rgba(0,229,255,.25);
    border-radius: 30px;
    padding: 4px 10px;
    cursor: pointer;
    transition: background 0.2s, box-shadow 0.2s;
  }
  .trans-direction:hover {
    background: rgba(0,229,255,.08);
    box-shadow: 0 0 12px rgba(0,229,255,.25);
  }
  .trans-direction span {
    font-family: 'Raleway', sans-serif;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--gold-pale);
  }
  .trans-direction .arrow {
    color: var(--gold);
    font-size: 10px;
    transition: transform 0.35s ease;
  }
  .trans-direction.flipped .arrow { transform: rotate(180deg); }

  /* Input area */
  .trans-input-wrap {
    position: relative;
    margin-bottom: 0.7rem;
  }
  #trans-input {
    width: 100%;
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(0,229,255,.2);
    border-radius: 12px;
    padding: 0.7rem 0.9rem;
    font-family: 'Raleway', sans-serif;
    font-size: 0.76rem;
    font-weight: 400;
    color: var(--cream);
    outline: none;
    resize: none;
    height: 68px;
    transition: border-color 0.25s, box-shadow 0.25s;
    line-height: 1.5;
  }
  #trans-input::placeholder { color: var(--muted); font-size: 0.71rem; }
  #trans-input:focus {
    border-color: rgba(0,229,255,.55);
    box-shadow: 0 0 0 3px rgba(0,229,255,.08), 0 0 16px rgba(0,229,255,.12);
  }

  #trans-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
    border: none;
    border-radius: 10px;
    padding: 0.62rem;
    font-family: 'Raleway', sans-serif;
    font-size: 0.63rem;
    font-weight: 700;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--navy-deep);
    cursor: pointer;
    transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
    margin-bottom: 0.9rem;
    box-shadow: 0 4px 16px rgba(196,164,90,.25);
    position: relative;
    overflow: hidden;
  }
  #trans-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,.15) 0%, transparent 60%);
    border-radius: 10px;
  }
  #trans-btn:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(196,164,90,.35); }
  #trans-btn:disabled { opacity: 0.45; cursor: wait; transform: none; }

  /* Resultado */
  #trans-result {
    display: none;
    border-top: 1px solid rgba(0,229,255,.12);
    padding-top: 0.9rem;
  }
  #trans-result.visible { display: block; }

  .result-label {
    font-family: 'Raleway', sans-serif;
    font-size: 7.5px;
    font-weight: 700;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0.65;
    margin-bottom: 0.3rem;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .result-label::before {
    content: '';
    width: 12px; height: 1px;
    background: var(--neon);
    opacity: 0.5;
  }
  .result-translation {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.25rem;
    font-weight: 400;
    color: var(--cream);
    line-height: 1.3;
    margin-bottom: 0.85rem;
    padding: 0.5rem 0.7rem;
    background: rgba(0,229,255,.03);
    border-radius: 8px;
    border-left: 2px solid rgba(0,229,255,.5);
  }
  .result-block { margin-bottom: 0.7rem; }
  .result-block p {
    font-family: 'Raleway', sans-serif;
    font-size: 0.68rem;
    font-weight: 400;
    color: rgba(255,255,255,.6);
    line-height: 1.65;
  }
  .result-block p em {
    font-style: italic;
    color: var(--gold-pale);
  }

  .trans-loading {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0.5rem 0;
  }
  .trans-spinner {
    width: 14px; height: 14px;
    border: 1.5px solid rgba(0,229,255,.15);
    border-top-color: var(--neon);
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .trans-loading span {
    font-family: 'Raleway', sans-serif;
    font-size: 0.63rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }

</style>
</head>
<body>

<section id="hero">

  <div id="loading-state">
    <span class="loading-logo">MD Talk</span>
  </div>

  <div id="hero-bg"></div>
  <div id="hero-overlay"></div>
  <div id="hero-dots"></div>

  <div id="hero-content">
    <span class="overline" id="greeting-overline">Boa noite,</span>

    <h1 class="hero-name" id="student-name">Thaiana</h1>

    <div class="hero-divider"></div>

    <div class="hero-info">
      <span id="info-city">São Paulo, SP</span>
      <span class="sep"></span>
      <span id="info-temp">—°C</span>
      <span class="sep"></span>
      <span id="info-condition">Carregando</span>
    </div>

    <div id="clock">00:00:00</div>

    <div class="clima-label">
      <span class="clima-dot"></span>
      <span>Clima ao vivo</span>
    </div>
  </div>


  <!-- TRADUTOR FLUTUANTE -->
  <div id="translator" style="bottom: 60px; right: 48px;">
    <div class="trans-header">
      <div class="trans-title-wrap">
        <div class="trans-icon">⚕</div>
        <span class="trans-title">Tradutor Médico</span>
      </div>
      <div class="trans-direction" id="trans-dir" onclick="toggleDirection()">
        <span id="dir-from">PT</span>
        <span class="arrow">⇄</span>
        <span id="dir-to">EN</span>
      </div>
    </div>

    <div class="trans-input-wrap">
      <textarea id="trans-input" placeholder="Digite uma palavra, frase ou termo clínico..."></textarea>
    </div>

    <button id="trans-btn" onclick="translate()">Traduzir</button>

    <div id="trans-result">
      <div class="trans-loading" id="trans-loading" style="display:none;">
        <div class="trans-spinner"></div>
        <span>Traduzindo...</span>
      </div>
      <div id="trans-output"></div>
    </div>
  </div>

</section>

<script>
// ── IMAGENS DO DRIVE ───────────────────────────────────────
const IMAGES = {
  "amanhecer-limpo": "1Rk7SnutIEJnS48SbQsh_IkjAzGy3IpYm",
  "amanhecer-chuva": "1ZuEQ4zA-f_f7iApj4YrujNUA9mLLDnGU",
  "dia-ensolarado":  "17UO6iLqIaiA5vnYEs7jqkDR3d1jiL35E",
  "dia-nublado":     "1NGL3xbDMu4DxcT1Kca20280VfflbjjeX",
  "dia-chuva":       "1OXhei11KCLjOLBv1nGzQpw6Sw36X3FTQ",
  "por-do-sol":      "1PDwEYdjlZ2eqa1lZcGSReQryNrLqjLqo",
  "noite-limpa":     "1SSXCMyE7xw611qr7IukKmFuW8RsdbTkT",
  "noite-chuva":     "1AFVaFEdP8AFqQHtExCZUCmlJMCxDWHVo"
};

function driveUrl(id) {
  return `https://drive.google.com/thumbnail?id=${id}&sz=w1920`;
}

function selectImage(code, hour) {
  const rainy  = code >= 51;
  const cloudy = code >= 1 && code < 51;
  if (hour >= 5  && hour < 8)  return rainy ? "amanhecer-chuva" : "amanhecer-limpo";
  if (hour >= 8  && hour < 17) return rainy ? "dia-chuva" : cloudy ? "dia-nublado" : "dia-ensolarado";
  if (hour >= 17 && hour < 20) return "por-do-sol";
  return rainy ? "noite-chuva" : "noite-limpa";
}

// ── SAUDAÇÃO ──────────────────────────────────────────────
function greetingText(hour) {
  if (hour >= 5  && hour < 12) return "Bom dia,";
  if (hour >= 12 && hour < 18) return "Boa tarde,";
  return "Boa noite,";
}

// ── DESCRIÇÃO DO CLIMA ────────────────────────────────────
function weatherDesc(code) {
  if (code === 0)  return "Céu limpo";
  if (code <= 3)   return "Parcialmente nublado";
  if (code <= 48)  return "Nublado";
  if (code <= 67)  return "Chuva";
  return "Tempestade";
}

// ── RELÓGIO ───────────────────────────────────────────────
function startClock() {
  function tick() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    const s = String(now.getSeconds()).padStart(2,'0');
    document.getElementById("clock").textContent = `${h}:${m}:${s}`;
  }
  tick();
  setInterval(tick, 1000);
}

// ── CLIMA VIA CLAUDE BACKEND ──────────────────────────────
async function fetchWeather(city) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 1000,
      system: `Return ONLY a valid JSON object, no markdown, no explanation.
Format: {"lat": number, "lon": number}
Return coordinates for this Brazilian city.`,
      messages: [{ role: "user", content: city }]
    })
  });
  const data = await res.json();
  const text = data.content.filter(b => b.type === "text").map(b => b.text).join("");
  const { lat, lon } = JSON.parse(text.replace(/```json|```/g,"").trim());

  const w = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
  const wd = await w.json();
  return {
    code: wd.current_weather.weathercode,
    temp: Math.round(wd.current_weather.temperature)
  };
}

// ── INICIALIZAÇÃO ─────────────────────────────────────────
async function init() {
  const name = sessionStorage.getItem("mdtalk_student_name") || "Thaiana";
  const city = sessionStorage.getItem("mdtalk_student_city") || "São Paulo";
  const hour = new Date().getHours();

  // Textos estáticos imediatos
  document.getElementById("greeting-overline").textContent = greetingText(hour);
  document.getElementById("student-name").textContent = name;
  document.getElementById("info-city").textContent = city + ", SP";

  startClock();

  // Clima
  let code = 0, temp = "—";
  try {
    const w = await fetchWeather(city);
    code = w.code;
    temp = w.temp;
  } catch(e) {}

  document.getElementById("info-temp").textContent = `${temp}°C`;
  document.getElementById("info-condition").textContent = weatherDesc(code);

  // Imagem de fundo
  const key = selectImage(code, hour);
  const bg  = document.getElementById("hero-bg");
  const img = new Image();
  img.onload = () => {
    bg.style.backgroundImage = `url('${driveUrl(IMAGES[key])}')`;
    bg.classList.add("loaded");
  };
  img.onerror = () => {
    bg.style.background = `radial-gradient(ellipse at 50% 30%, #163158 0%, #050D1A 70%)`;
    bg.classList.add("loaded");
  };
  img.src = driveUrl(IMAGES[key]);

  // Revela
  setTimeout(() => {
    document.getElementById("loading-state").classList.add("hidden");
    document.getElementById("hero-content").classList.add("visible");
  }, 600);
}

init();


// ── TRADUTOR ──────────────────────────────────────────────
let direction = 'PT_EN'; // PT→EN ou EN_PT

function toggleDirection() {
  direction = direction === 'PT_EN' ? 'EN_PT' : 'PT_EN';
  const dir = document.getElementById('trans-dir');
  dir.classList.toggle('flipped');
  document.getElementById('dir-from').textContent = direction === 'PT_EN' ? 'PT' : 'EN';
  document.getElementById('dir-to').textContent   = direction === 'PT_EN' ? 'EN' : 'PT';
  document.getElementById('trans-input').placeholder =
    direction === 'PT_EN'
      ? 'Digite uma palavra, frase ou termo clínico...'
      : 'Type a word, phrase or clinical term...';
}

async function translate() {
  const text = document.getElementById('trans-input').value.trim();
  if (!text) return;

  const btn = document.getElementById('trans-btn');
  const result = document.getElementById('trans-result');
  const loading = document.getElementById('trans-loading');
  const output = document.getElementById('trans-output');

  btn.disabled = true;
  result.classList.add('visible');
  loading.style.display = 'flex';
  output.innerHTML = '';

  const fromLang = direction === 'PT_EN' ? 'Portuguese' : 'English';
  const toLang   = direction === 'PT_EN' ? 'English'    : 'Portuguese';

  const prompt = `You are a medical English expert. Translate the following ${fromLang} term/phrase to ${toLang} in the medical/clinical context.

Input: "${text}"

Return ONLY a valid JSON object with this exact structure, no markdown, no explanation:
{
  "translation": "main translation here",
  "synonyms": ["synonym1", "synonym2"],
  "clinical_use": "brief explanation of clinical context and usage (2-3 sentences)",
  "example": "example sentence using the translation in a clinical context"
}`;

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        messages: [{ role: "user", content: prompt }]
      })
    });
    const data = await res.json();
    const raw = data.content.filter(b => b.type === "text").map(b => b.text).join("");
    const json = JSON.parse(raw.replace(/```json|```/g,"").trim());

    loading.style.display = 'none';
    output.innerHTML = `
      <div class="result-label">Tradução</div>
      <div class="result-translation">${json.translation}</div>

      ${json.synonyms && json.synonyms.length ? `
      <div class="result-block">
        <div class="result-label">Sinônimos</div>
        <p>${json.synonyms.join(' · ')}</p>
      </div>` : ''}

      <div class="result-block">
        <div class="result-label">Uso Clínico</div>
        <p>${json.clinical_use}</p>
      </div>

      <div class="result-block">
        <div class="result-label">Exemplo</div>
        <p><em>${json.example}</em></p>
      </div>
    `;
  } catch(e) {
    loading.style.display = 'none';
    output.innerHTML = '<p style="color:rgba(255,255,255,.4);font-size:.7rem;">Erro ao traduzir. Tente novamente.</p>';
  }

  btn.disabled = false;
}

// Enter para traduzir (Shift+Enter = nova linha)
document.getElementById('trans-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); translate(); }
});

// ── DRAG DO TRADUTOR ──────────────────────────────────────
(function() {
  const el = document.getElementById('translator');
  let isDragging = false, startX, startY, origX, origY;

  el.addEventListener('mousedown', e => {
    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'BUTTON') return;
    isDragging = true;
    el.classList.add('dragging');
    const rect = el.getBoundingClientRect();
    startX = e.clientX; startY = e.clientY;
    origX  = rect.left;  origY  = rect.top;
    e.preventDefault();
  });

  document.addEventListener('mousemove', e => {
    if (!isDragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    el.style.left   = (origX + dx) + 'px';
    el.style.top    = (origY + dy) + 'px';
    el.style.right  = 'auto';
    el.style.bottom = 'auto';
  });

  document.addEventListener('mouseup', () => {
    isDragging = false;
    el.classList.remove('dragging');
  });
})();

</script>
