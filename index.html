<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caderno do Aluno — MD Talk</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy-deep: #050D1A;
    --gold:      #C4A45A;
    --gold-light:#D4BA7A;
    --cream:     rgba(255,255,255,.88);
    --muted:     rgba(255,255,255,.42);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Raleway', sans-serif;
    background: var(--navy-deep);
    color: var(--cream);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HERO ── */
  #hero {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }

  /* Imagem de fundo */
  #hero-bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    opacity: 0;
    transition: opacity 1.6s ease;
  }
  #hero-bg.loaded { opacity: 1; }

  /* Overlay */
  #hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(5,13,26,0.80) 0%,
      rgba(5,13,26,0.68) 40%,
      rgba(5,13,26,0.88) 100%
    );
  }

  /* Dot grid */
  #hero-dots {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(196,164,90,.07) 1px, transparent 1px);
    background-size: 30px 30px;
    pointer-events: none;
  }

  /* ── CONTEÚDO ── */
  #hero-content {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 2rem;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 1.1s ease 0.6s, transform 1.1s ease 0.6s;
  }
  #hero-content.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* Overline — "BOA NOITE," */
  .overline {
    font-family: 'Raleway', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 0.6rem;
    display: block;
  }

  /* Nome grande */
  .hero-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(4.5rem, 12vw, 9rem);
    font-weight: 400;
    line-height: 0.95;
    color: var(--cream);
    letter-spacing: -0.01em;
    margin-bottom: 0;
  }

  /* Divider fino */
  .hero-divider {
    width: 40px;
    height: 1px;
    background: rgba(196,164,90,0.5);
    margin: 1.4rem auto 1.2rem;
  }

  /* Linha de info: cidade · temp · condição */
  .hero-info {
    font-family: 'Raleway', sans-serif;
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 0.9rem;
  }
  .hero-info .sep {
    width: 3px; height: 3px;
    background: var(--gold);
    border-radius: 50%;
    opacity: 0.6;
    flex-shrink: 0;
  }

  /* Relógio */
  #clock {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.1rem, 3vw, 1.6rem);
    font-weight: 300;
    letter-spacing: 0.18em;
    color: var(--cream);
    opacity: 0.75;
    margin-bottom: 1.4rem;
  }

  /* Clima ao vivo */
  .clima-label {
    font-family: 'Raleway', sans-serif;
    font-size: 0.62rem;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0.7;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
  }
  .clima-dot {
    width: 6px; height: 6px;
    background: var(--gold);
    border-radius: 50%;
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.3; transform: scale(0.8); }
    50%       { opacity: 1;   transform: scale(1.2); }
  }

  /* Loading */
  #loading-state {
    position: absolute;
    inset: 0;
    background: var(--navy-deep);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
    transition: opacity 1s ease;
  }
  #loading-state.hidden { opacity: 0; pointer-events: none; }
  .loading-logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.2rem;
    font-weight: 300;
    letter-spacing: 0.38em;
    color: var(--gold);
    text-transform: uppercase;
    animation: fadeInOut 2s ease-in-out infinite;
  }
  @keyframes fadeInOut {
    0%, 100% { opacity: 0.15; }
    50%       { opacity: 0.7; }
  }

  /* ── TRADUTOR FLUTUANTE ── */
  #translator {
    position: fixed;
    z-index: 100;
    width: 320px;
    background: rgba(5,13,26,0.82);
    border: 1px solid rgba(0,229,255,.35);
    border-radius: 20px;
    box-shadow:
      0 0 0 1px rgba(0,229,255,.08),
      0 12px 60px rgba(0,0,0,0.7),
      0 0 40px rgba(0,229,255,.12),
      0 0 80px rgba(0,229,255,.06),
      inset 0 1px 0 rgba(255,255,255,.04);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 1.2rem 1.4rem 1.4rem;
    animation: translatorFloat 9s ease-in-out infinite;
    cursor: grab;
    user-select: none;
    overflow-x: hidden;
  }
  /* linha de scan tech */
  #translator::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0,229,255,.8), transparent);
    animation: scanLine 3s ease-in-out infinite;
  }
  @keyframes scanLine {
    0%, 100% { opacity: 0.3; transform: scaleX(0.4); }
    50%       { opacity: 1;   transform: scaleX(1); }
  }
  /* corner marks */
  #translator::after {
    content: '';
    position: absolute;
    top: 10px; right: 10px;
    width: 8px; height: 8px;
    border-top: 1px solid rgba(0,229,255,.7);
    border-right: 1px solid rgba(0,229,255,.7);
    border-radius: 0 3px 0 0;
  }

  #translator:active { cursor: grabbing; }

  @keyframes translatorFloat {
    0%   { transform: translateY(0px)   translateX(0px); }
    20%  { transform: translateY(-22px) translateX(18px); }
    40%  { transform: translateY(-10px) translateX(36px); }
    60%  { transform: translateY(-30px) translateX(20px); }
    80%  { transform: translateY(-16px) translateX(6px); }
    100% { transform: translateY(0px)   translateX(0px); }
  }
  #translator.dragging { animation: none; }
  #translator.minimized {
    width: 52px !important;
    height: 52px !important;
    padding: 0 !important;
    border-radius: 50% !important;
    overflow: hidden;
    cursor: pointer !important;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow:
      0 0 0 1px rgba(0,229,255,.08),
      0 8px 32px rgba(0,0,0,0.7),
      0 0 24px rgba(0,229,255,.25),
      0 0 60px rgba(0,229,255,.12);
  }
  #translator.minimized .trans-body { display: none; }
  #translator.minimized .trans-header { display: none; }
  #translator.minimized::before { display: none; }
  #translator.minimized::after { display: none; }
  #trans-icon-min {
    display: none;
    font-size: 22px;
    color: rgba(0,229,255,.9);
    pointer-events: none;
  }
  #translator.minimized #trans-icon-min { display: flex; align-items: center; justify-content: center; }
  /* pulse ring quando minimizado */
  #translator.minimized .pulse-ring {
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 1.5px solid rgba(0,229,255,.4);
    animation: pulseRing 2s ease-out infinite;
  }
  @keyframes pulseRing {
    0%   { transform: scale(1);   opacity: 0.7; }
    100% { transform: scale(1.5); opacity: 0; }
  }

  .trans-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
  }
  .trans-title-wrap {
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .trans-icon {
    width: 20px; height: 20px;
    border-radius: 6px;
    background: rgba(0,229,255,.08);
    border: 1px solid rgba(0,229,255,.3);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px;
  }
  .trans-title {
    font-family: 'Raleway', sans-serif;
    font-size: 8.5px;
    font-weight: 700;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .trans-direction {
    display: flex;
    align-items: center;
    gap: 5px;
    background: rgba(0,229,255,.04);
    border: 1px solid rgba(0,229,255,.25);
    border-radius: 30px;
    padding: 4px 10px;
    cursor: pointer;
    transition: background 0.2s, box-shadow 0.2s;
  }
  .trans-direction:hover {
    background: rgba(0,229,255,.08);
    box-shadow: 0 0 12px rgba(0,229,255,.25);
  }
  .trans-direction span {
    font-family: 'Raleway', sans-serif;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--gold-pale);
  }
  .trans-direction .arrow {
    color: var(--gold);
    font-size: 10px;
    transition: transform 0.35s ease;
  }
  .trans-direction.flipped .arrow { transform: rotate(180deg); }

  /* Input area */
  .trans-input-wrap {
    position: relative;
    margin-bottom: 0.7rem;
  }
  #trans-input {
    width: 100%;
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(0,229,255,.2);
    border-radius: 12px;
    padding: 0.7rem 0.9rem;
    font-family: 'Raleway', sans-serif;
    font-size: 0.76rem;
    font-weight: 400;
    color: var(--cream);
    outline: none;
    resize: none;
    height: 68px;
    transition: border-color 0.25s, box-shadow 0.25s;
    line-height: 1.5;
  }
  #trans-input::placeholder { color: var(--muted); font-size: 0.71rem; }
  #trans-input:focus {
    border-color: rgba(0,229,255,.55);
    box-shadow: 0 0 0 3px rgba(0,229,255,.08), 0 0 16px rgba(0,229,255,.12);
  }

  #trans-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
    border: none;
    border-radius: 10px;
    padding: 0.62rem;
    font-family: 'Raleway', sans-serif;
    font-size: 0.63rem;
    font-weight: 700;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--navy-deep);
    cursor: pointer;
    transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
    margin-bottom: 0.9rem;
    box-shadow: 0 4px 16px rgba(196,164,90,.25);
    position: relative;
    overflow-x: hidden;
  }
  #trans-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,.15) 0%, transparent 60%);
    border-radius: 10px;
  }
  #trans-btn:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(196,164,90,.35); }
  #trans-btn:disabled { opacity: 0.45; cursor: wait; transform: none; }

  /* Resultado */
  #trans-result {
    display: none;
    border-top: 1px solid rgba(0,229,255,.12);
    padding-top: 0.9rem;
  }
  #trans-result.visible { display: block; }

  .result-label {
    font-family: 'Raleway', sans-serif;
    font-size: 7.5px;
    font-weight: 700;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0.65;
    margin-bottom: 0.3rem;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .result-label::before {
    content: '';
    width: 12px; height: 1px;
    background: var(--neon);
    opacity: 0.5;
  }
  .result-translation {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.25rem;
    font-weight: 400;
    color: var(--cream);
    line-height: 1.3;
    margin-bottom: 0.85rem;
    padding: 0.5rem 0.7rem;
    background: rgba(0,229,255,.03);
    border-radius: 8px;
    border-left: 2px solid rgba(0,229,255,.5);
  }
  .result-block { margin-bottom: 0.7rem; }
  .result-block p {
    font-family: 'Raleway', sans-serif;
    font-size: 0.68rem;
    font-weight: 400;
    color: rgba(255,255,255,.6);
    line-height: 1.65;
  }
  .result-block p em {
    font-style: italic;
    color: var(--gold-pale);
  }

  .trans-loading {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0.5rem 0;
  }
  .trans-spinner {
    width: 14px; height: 14px;
    border: 1.5px solid rgba(0,229,255,.15);
    border-top-color: var(--neon);
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .trans-loading span {
    font-family: 'Raleway', sans-serif;
    font-size: 0.63rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }


/* ═══════════════════════════════════════════════
   CADERNO DO ALUNO — MD Talk
═══════════════════════════════════════════════ */

/* ── SEÇÃO CADERNO ── */
#caderno {
  background: var(--navy-deep);
  min-height: 100vh;
  padding: 5rem 2rem 6rem;
}

.caderno-wrap {
  max-width: 1100px;
  margin: 0 auto;
}

/* Header do caderno */
.caderno-header {
  text-align: center;
  margin-bottom: 3.5rem;
}
.caderno-overline {
  font-family: 'Raleway', sans-serif;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--gold);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-bottom: 0.8rem;
}
.caderno-overline::before,
.caderno-overline::after {
  content: '';
  width: 32px; height: 1px;
  background: var(--gold);
  opacity: 0.4;
}
.caderno-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 300;
  color: var(--cream);
  line-height: 1.1;
}
.caderno-title em {
  font-style: italic;
  color: var(--gold-light);
}

/* ── TOOLBAR ── */
.caderno-toolbar {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-bottom: 1.8rem;
  flex-wrap: wrap;
}

/* Search */
.search-wrap {
  position: relative;
  flex: 1;
  min-width: 200px;
}
.search-wrap svg {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
}
#search-input {
  width: 100%;
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(196,164,90,.18);
  border-radius: 10px;
  padding: 0.6rem 0.9rem 0.6rem 2.4rem;
  font-family: 'Raleway', sans-serif;
  font-size: 0.75rem;
  color: var(--cream);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
#search-input::placeholder { color: var(--muted); }
#search-input:focus {
  border-color: rgba(196,164,90,.4);
  box-shadow: 0 0 0 3px rgba(196,164,90,.06);
}

/* Botão novo item */
.btn-novo {
  display: flex;
  align-items: center;
  gap: 7px;
  background: var(--gold);
  border: none;
  border-radius: 10px;
  padding: 0.6rem 1.3rem;
  font-family: 'Raleway', sans-serif;
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--navy-deep);
  cursor: pointer;
  transition: background 0.2s, transform 0.15s;
  white-space: nowrap;
}
.btn-novo:hover { background: var(--gold-light); transform: translateY(-1px); }
.btn-novo svg { flex-shrink: 0; }

/* Botão download */
.btn-download {
  display: flex;
  align-items: center;
  gap: 7px;
  background: transparent;
  border: 1px solid rgba(196,164,90,.3);
  border-radius: 10px;
  padding: 0.6rem 1.1rem;
  font-family: 'Raleway', sans-serif;
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gold);
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s;
  white-space: nowrap;
}
.btn-download:hover {
  background: rgba(196,164,90,.08);
  border-color: rgba(196,164,90,.5);
}

/* ── TABS DE SEÇÃO ── */
.tabs-wrap {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 2rem;
  flex-wrap: wrap;
}
.tab {
  font-family: 'Raleway', sans-serif;
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
  background: transparent;
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 30px;
  padding: 0.45rem 1.1rem;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.tab:hover { color: var(--gold-pale); border-color: rgba(196,164,90,.25); }
.tab.active {
  color: var(--navy-deep);
  background: var(--gold);
  border-color: var(--gold);
}
.tab-nova {
  color: rgba(0,229,255,.6);
  border-color: rgba(0,229,255,.2);
  background: rgba(0,229,255,.04);
}
.tab-nova:hover {
  color: rgba(0,229,255,.9);
  border-color: rgba(0,229,255,.4);
  background: rgba(0,229,255,.08);
}

/* ── GRID DE CARDS ── */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1.2rem;
}

/* Card */
.card {
  background: rgba(15,38,69,0.6);
  border: 1px solid rgba(196,164,90,.15);
  border-radius: 16px;
  padding: 1.3rem 1.4rem;
  position: relative;
  transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  animation: cardReveal 0.4s ease forwards;
  opacity: 0;
  transform: translateY(12px);
}
@keyframes cardReveal {
  to { opacity: 1; transform: translateY(0); }
}
.card:hover {
  transform: translateY(-3px);
  border-color: rgba(196,164,90,.35);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}

/* Tag de seção no card */
.card-tag {
  display: inline-block;
  font-family: 'Raleway', sans-serif;
  font-size: 7.5px;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--navy-deep);
  background: var(--gold);
  border-radius: 20px;
  padding: 2px 9px;
  margin-bottom: 0.75rem;
}
.card-tag.vocabulario { background: var(--gold); }
.card-tag.frases      { background: rgba(0,229,255,.8); color: var(--navy-deep); }
.card-tag.termos      { background: rgba(196,164,90,.5); }
.card-tag.anotacoes   { background: rgba(255,255,255,.15); color: var(--cream); }
.card-tag.custom      { background: rgba(163,120,220,.7); color: #fff; }

/* Termo principal */
.card-termo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.35rem;
  font-weight: 400;
  color: var(--cream);
  line-height: 1.2;
  margin-bottom: 0.3rem;
}

/* Tradução */
.card-traducao {
  font-family: 'Raleway', sans-serif;
  font-size: 0.72rem;
  font-weight: 500;
  color: var(--gold-pale);
  opacity: 0.8;
  margin-bottom: 0.65rem;
  display: flex;
  align-items: center;
  gap: 6px;
}
.card-traducao::before {
  content: '';
  width: 14px; height: 1px;
  background: var(--gold);
  opacity: 0.4;
  flex-shrink: 0;
}

/* Exemplo */
.card-exemplo {
  font-family: 'Raleway', sans-serif;
  font-size: 0.69rem;
  font-weight: 400;
  color: rgba(255,255,255,.5);
  font-style: italic;
  line-height: 1.6;
  border-top: 1px solid rgba(255,255,255,.06);
  padding-top: 0.6rem;
  margin-top: 0.3rem;
}

/* Data */
.card-date {
  font-family: 'Raleway', sans-serif;
  font-size: 0.6rem;
  font-weight: 500;
  letter-spacing: 0.12em;
  color: var(--muted);
  margin-top: 0.8rem;
  opacity: 0.6;
}

/* Ações do card */
.card-actions {
  position: absolute;
  top: 1rem; right: 1rem;
  display: flex;
  gap: 6px;
  opacity: 0;
  transition: opacity 0.2s;
}
.card:hover .card-actions { opacity: 1; }

<script>
// ── IMAGENS DO DRIVE ───────────────────────────────────────
const IMAGES = {
  "amanhecer-limpo": "1Rk7SnutIEJnS48SbQsh_IkjAzGy3IpYm",
  "amanhecer-chuva": "1ZuEQ4zA-f_f7iApj4YrujNUA9mLLDnGU",
  "dia-ensolarado":  "17UO6iLqIaiA5vnYEs7jqkDR3d1jiL35E",
  "dia-nublado":     "1NGL3xbDMu4DxcT1Kca20280VfflbjjeX",
  "dia-chuva":       "1OXhei11KCLjOLBv1nGzQpw6Sw36X3FTQ",
  "por-do-sol":      "1PDwEYdjlZ2eqa1lZcGSReQryNrLqjLqo",
  "noite-limpa":     "1SSXCMyE7xw611qr7IukKmFuW8RsdbTkT",
  "noite-chuva":     "1AFVaFEdP8AFqQHtExCZUCmlJMCxDWHVo"
};

function driveUrl(id) {
  return `https://drive.google.com/thumbnail?id=${id}&sz=w1920`;
}

function selectImage(code, hour) {
  const rainy  = code >= 51;
  const cloudy = code >= 1 && code < 51;
  if (hour >= 5  && hour < 8)  return rainy ? "amanhecer-chuva" : "amanhecer-limpo";
  if (hour >= 8  && hour < 17) return rainy ? "dia-chuva" : cloudy ? "dia-nublado" : "dia-ensolarado";
  if (hour >= 17 && hour < 20) return "por-do-sol";
  return rainy ? "noite-chuva" : "noite-limpa";
}

// ── SAUDAÇÃO ──────────────────────────────────────────────
function greetingText(hour) {
  if (hour >= 5  && hour < 12) return "Bom dia,";
  if (hour >= 12 && hour < 18) return "Boa tarde,";
  return "Boa noite,";
}

// ── DESCRIÇÃO DO CLIMA ────────────────────────────────────
function weatherDesc(code) {
  if (code === 0)  return "Céu limpo";
  if (code <= 3)   return "Parcialmente nublado";
  if (code <= 48)  return "Nublado";
  if (code <= 67)  return "Chuva";
  return "Tempestade";
}

// ── RELÓGIO ───────────────────────────────────────────────
function startClock() {
  function tick() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    const s = String(now.getSeconds()).padStart(2,'0');
    document.getElementById("clock").textContent = `${h}:${m}:${s}`;
  }
  tick();
  setInterval(tick, 1000);
}

// ── CLIMA VIA CLAUDE BACKEND ──────────────────────────────
async function fetchWeather(city) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 1000,
      system: `Return ONLY a valid JSON object, no markdown, no explanation.
Format: {"lat": number, "lon": number}
Return coordinates for this Brazilian city.`,
      messages: [{ role: "user", content: city }]
    })
  });
  const data = await res.json();
  const text = data.content.filter(b => b.type === "text").map(b => b.text).join("");
  const { lat, lon } = JSON.parse(text.replace(/```json|```/g,"").trim());

  const w = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
  const wd = await w.json();
  return {
    code: wd.current_weather.weathercode,
    temp: Math.round(wd.current_weather.temperature)
  };
}

// ── INICIALIZAÇÃO ─────────────────────────────────────────
async function init() {
  const name = sessionStorage.getItem("mdtalk_student_name") || "Thaiana";
  const city = sessionStorage.getItem("mdtalk_student_city") || "São Paulo";
  const hour = new Date().getHours();

  // Textos estáticos imediatos
  document.getElementById("greeting-overline").textContent = greetingText(hour);
  document.getElementById("student-name").textContent = name;
  document.getElementById("info-city").textContent = city + ", SP";

  startClock();

  // Clima
  let code = 0, temp = "—";
  try {
    const w = await fetchWeather(city);
    code = w.code;
    temp = w.temp;
  } catch(e) {}

  document.getElementById("info-temp").textContent = `${temp}°C`;
  document.getElementById("info-condition").textContent = weatherDesc(code);

  // Imagem de fundo
  const key = selectImage(code, hour);
  const bg  = document.getElementById("hero-bg");
  const img = new Image();
  img.onload = () => {
    bg.style.backgroundImage = `url('${driveUrl(IMAGES[key])}')`;
    bg.classList.add("loaded");
  };
  img.onerror = () => {
    bg.style.background = `radial-gradient(ellipse at 50% 30%, #163158 0%, #050D1A 70%)`;
    bg.classList.add("loaded");
  };
  img.src = driveUrl(IMAGES[key]);

  // Revela
  setTimeout(() => {
    document.getElementById("loading-state").classList.add("hidden");
    document.getElementById("hero-content").classList.add("visible");
  }, 600);
}

init();


// ── TOGGLE TRADUTOR ──────────────────────────────────────────
function toggleTranslator(e) {
  const el = document.getElementById('translator');
  if (el.classList.contains('minimized')) {
    el.classList.remove('minimized');
    e.stopPropagation();
  }
}
document.getElementById('translator').addEventListener('click', function(e) {
  if (this.classList.contains('minimized')) {
    this.classList.remove('minimized');
    e.stopPropagation();
  }
});

// ── TRADUTOR ──────────────────────────────────────────────
let direction = 'PT_EN'; // PT→EN ou EN_PT

function toggleDirection() {
  direction = direction === 'PT_EN' ? 'EN_PT' : 'PT_EN';
  const dir = document.getElementById('trans-dir');
  dir.classList.toggle('flipped');
  document.getElementById('dir-from').textContent = direction === 'PT_EN' ? 'PT' : 'EN';
  document.getElementById('dir-to').textContent   = direction === 'PT_EN' ? 'EN' : 'PT';
  document.getElementById('trans-input').placeholder =
    direction === 'PT_EN'
      ? 'Digite uma palavra, frase ou termo clínico...'
      : 'Type a word, phrase or clinical term...';
}

async function translate() {
  const text = document.getElementById('trans-input').value.trim();
  if (!text) return;

  const btn    = document.getElementById('trans-btn');
  const result = document.getElementById('trans-result');
  const loading = document.getElementById('trans-loading');
  const output = document.getElementById('trans-output');

  btn.disabled = true;
  result.classList.add('visible');
  loading.style.display = 'flex';
  output.innerHTML = '';

  const sl = direction === 'PT_EN' ? 'pt' : 'en';
  const tl = direction === 'PT_EN' ? 'en' : 'pt';

  try {
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&dt=bd&q=${encodeURIComponent(text)}`;
    const res  = await fetch(url);
    const data = await res.json();

    // Tradução principal — array[0] contém os segmentos traduzidos
    const mainTranslation = data[0]
      .filter(seg => seg && seg[0])
      .map(seg => seg[0])
      .join('');

    // Definições/sinônimos — data[1] quando disponível
    let synonymsHtml = '';
    if (data[1] && data[1].length) {
      const syns = [];
      data[1].forEach(group => {
        if (group[2]) group[2].forEach(item => { if(item[0]) syns.push(item[0]); });
      });
      if (syns.length) {
        synonymsHtml = `
        <div class="result-block">
          <div class="result-label">Alternativas</div>
          <p>${syns.slice(0,6).join(' · ')}</p>
        </div>`;
      }
    }

    loading.style.display = 'none';
    output.innerHTML = `
      <div class="result-label">Tradução</div>
      <div class="result-translation">${mainTranslation}</div>
      ${synonymsHtml}
    `;

  } catch(e) {
    loading.style.display = 'none';
    output.innerHTML = '<p style="color:rgba(255,255,255,.4);font-size:.7rem;">Erro ao traduzir. Tente novamente.</p>';
  }

  btn.disabled = false;
}

// Enter para traduzir (Shift+Enter = nova linha)
document.getElementById('trans-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); translate(); }
});

// ── DRAG DO TRADUTOR ──────────────────────────────────────
(function() {
  const el = document.getElementById('translator');
  let isDragging = false, startX, startY, origX, origY;

  el.addEventListener('mousedown', e => {
    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'BUTTON') return;
    isDragging = true;
    el.classList.add('dragging');
    const rect = el.getBoundingClientRect();
    startX = e.clientX; startY = e.clientY;
    origX  = rect.left;  origY  = rect.top;
    e.preventDefault();
  });

  document.addEventListener('mousemove', e => {
    if (!isDragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    el.style.left   = (origX + dx) + 'px';
    el.style.top    = (origY + dy) + 'px';
    el.style.right  = 'auto';
    el.style.bottom = 'auto';
  });

  document.addEventListener('mouseup', () => {
    isDragging = false;
    el.classList.remove('dragging');
  });
})();

</script>

<script>

let entradas = [

  { id:2, secao:'vocabulario', termo:'Tachycardia', traducao:'Taquicardia', exemplo:'On examination, the patient presented with tachycardia at 112 bpm.', data:'2025-05-01' },
  { id:3, secao:'frases', termo:'The patient denies any history of...', traducao:'O paciente nega qualquer histórico de...', exemplo:'The patient denies any history of chest pain or previous cardiac events.', data:'2025-05-03' },
  { id:4, secao:'frases', termo:'On further questioning...', traducao:'Ao aprofundar o interrogatório...', exemplo:'On further questioning, she admitted to occasional palpitations.', data:'2025-05-03' },
  { id:5, secao:'termos', termo:'Myocardial infarction', traducao:'Infarto agudo do miocárdio', exemplo:'The ECG findings were consistent with an acute myocardial infarction.', data:'2025-05-05' },
  { id:6, secao:'termos', termo:'Pulmonary embolism', traducao:'Embolia pulmonar', exemplo:'', data:'2025-05-06' },
  { id:7, secao:'anotacoes', termo:'Diferença: complaint vs. chief complaint', traducao:'', exemplo:'"Chief complaint" é o motivo principal da consulta. "Complaint" pode ser qualquer queixa secundária.', data:'2025-05-07' }
];

let tabAtiva   = 'todos';
let secoes     = ['vocabulario','frases','termos','anotacoes'];
let editandoId = null;
const tagLabel = { vocabulario:'Vocabulário', frases:'Frase', termos:'Termo Clínico', anotacoes:'Anotação' };

function formatDate(d) {
  if (!d) return '';
  const [y,m,dd] = d.split('-');
  return dd+'/'+m+'/'+y;
}

function renderCards() {
  const grid  = document.getElementById('cards-grid');
  const busca = document.getElementById('search-input').value.toLowerCase();
  let filtradas = entradas.filter(e => {
    const matchTab   = tabAtiva === 'todos' || e.secao === tabAtiva;
    const matchBusca = !busca ||
      e.termo.toLowerCase().includes(busca) ||
      (e.traducao && e.traducao.toLowerCase().includes(busca)) ||
      (e.exemplo  && e.exemplo.toLowerCase().includes(busca));
    return matchTab && matchBusca;
  });
  if (!filtradas.length) {
    grid.innerHTML = '<div class="empty-state"><p>Nenhuma entrada encontrada</p></div>';
    return;
  }
  grid.innerHTML = filtradas.map((e,i) => `
    <div class="card" style="animation-delay:${i*0.05}s">
      <span class="card-tag ${e.secao}">${tagLabel[e.secao] || e.secao}</span>
      <div class="card-actions">
        <div class="card-btn" onclick="editarEntrada(${e.id})">✎</div>
        <div class="card-btn delete" onclick="deletarEntrada(${e.id})">✕</div>
      </div>
      <div class="card-termo">${e.termo}</div>
      ${e.traducao ? '<div class="card-traducao">'+e.traducao+'</div>' : ''}
      ${e.exemplo  ? '<div class="card-exemplo">'+e.exemplo+'</div>'   : ''}
      <div class="card-date">${formatDate(e.data)}</div>
    </div>
  `).join('');
}

function setTab(tab, el) {
  tabAtiva = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderCards();
}

function novaSeccao() {
  const nome = prompt('Nome da nova seção:');
  if (!nome || !nome.trim()) return;
  const slug = nome.trim().toLowerCase().replace(/\s+/g,'-');
  if (secoes.includes(slug)) return;
  secoes.push(slug);
  const wrap    = document.getElementById('tabs-wrap');
  const btnNova = wrap.querySelector('.tab-nova');
  const tab     = document.createElement('button');
  tab.className   = 'tab';
  tab.dataset.tab = slug;
  tab.textContent = nome.trim();
  tab.onclick     = function(){ setTab(slug, this); };
  wrap.insertBefore(tab, btnNova);
  const select    = document.getElementById('form-secao');
  const opt       = document.createElement('option');
  opt.value       = slug;
  opt.textContent = nome.trim();
  select.appendChild(opt);
}

function abrirModal(dados) {
  editandoId = dados ? dados.id : null;
  document.getElementById('modal-title').textContent = dados ? 'Editar entrada' : 'Nova entrada';
  document.getElementById('form-termo').value    = dados ? dados.termo    : '';
  document.getElementById('form-traducao').value = dados ? dados.traducao : '';
  document.getElementById('form-exemplo').value  = dados ? dados.exemplo  : '';
  if (dados) document.getElementById('form-secao').value = dados.secao;
  document.getElementById('modal').classList.add('open');
  setTimeout(() => document.getElementById('form-termo').focus(), 300);
}

function fecharModal() {
  document.getElementById('modal').classList.remove('open');
  editandoId = null;
}

function fecharModalBackdrop(e) {
  if (e.target === document.getElementById('modal')) fecharModal();
}

function salvarEntrada() {
  const termo = document.getElementById('form-termo').value.trim();
  if (!termo) { document.getElementById('form-termo').focus(); return; }
  const nova = {
    id:       editandoId || Date.now(),
    secao:    document.getElementById('form-secao').value,
    termo,
    traducao: document.getElementById('form-traducao').value.trim(),
    exemplo:  document.getElementById('form-exemplo').value.trim(),
    data:     new Date().toISOString().split('T')[0]
  };
  entradas = editandoId
    ? entradas.map(e => e.id === editandoId ? nova : e)
    : [nova, ...entradas];
  fecharModal();
  renderCards();
}

function editarEntrada(id) {
  const e = entradas.find(e => e.id === id);
  if (e) abrirModal(e);
}

function deletarEntrada(id) {
  if (!confirm('Excluir esta entrada?')) return;
  entradas = entradas.filter(e => e.id !== id);
  renderCards();
}

function downloadCaderno() {
  const nome  = sessionStorage.getItem('mdtalk_student_name') || 'Aluno';
  const hoje  = new Date().toLocaleDateString('pt-BR');
  const agrupado = {};
  entradas.forEach(e => {
    const s = tagLabel[e.secao] || e.secao;
    if (!agrupado[s]) agrupado[s] = [];
    agrupado[s].push(e);
  });
  let txt = 'MD TALK — CADERNO DE ' + nome.toUpperCase() + '\nGerado em ' + hoje + '\n' + '='.repeat(50) + '\n';
  Object.entries(agrupado).forEach(([secao, items]) => {
    txt += '\n── ' + secao.toUpperCase() + ' ──\n\n';
    items.forEach(e => {
      txt += '• ' + e.termo + '\n';
      if (e.traducao) txt += '  → ' + e.traducao + '\n';
      if (e.exemplo)  txt += '  "' + e.exemplo + '"\n';
      txt += '  [' + formatDate(e.data) + ']\n\n';
    });
  });
  const blob = new Blob([txt], { type:'text/plain;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = 'caderno-mdtalk.txt'; a.click();
  URL.revokeObjectURL(url);
}

document.getElementById('search-input').addEventListener('input', renderCards);
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharModal(); });
renderCards();
</script>
</body>
</html>
